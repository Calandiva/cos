<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="화장품 제조 시뮬레이터. 원료를 골라 처방을 짜고 공정을 돌려 점도·pH·탁도·색상과 배치 규모별 오차까지 계산한다.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#A8436B">
<meta charset="utf-8">
<title>포뮬라랩 — 화장품 제조 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F3F6; --panel:#FFFFFF; --panel-2:#F6F8FA; --panel-3:#EAEEF3;
  --line:#DCE2E9; --line-2:#C2CCD6;
  --ink:#141E28; --ink-2:#4A5A6A; --ink-3:#8090A0;
  --acc:#A8436B; --acc-soft:#FCE9F0; --acc-line:#E2A5BE; --acc-ink:#FFFFFF;
  --ok:#237A4B; --ok-soft:#DFF2E7;
  --warn:#A96E08; --warn-soft:#FAEDD2;
  --bad:#C0353A; --bad-soft:#FBE0E1;
  --info:#2F5AAE; --info-soft:#E1E9F8;
  --shadow:0 1px 2px rgba(18,30,42,.05),0 10px 30px rgba(18,30,42,.10);
  --shadow-sm:0 1px 3px rgba(18,30,42,.10);
  --r:12px; --r-sm:9px;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","D2Coding",ui-monospace,Consolas,monospace;
  --topH:58px; --navH:62px; --tap:44px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1116; --panel:#151C23; --panel-2:#1B232B; --panel-3:#242E38;
  --line:#2A343F; --line-2:#3B4854;
  --ink:#E6ECF2; --ink-2:#A6B4C1; --ink-3:#71818F;
  --acc:#E692AE; --acc-soft:#31171F; --acc-line:#71384C; --acc-ink:#1D1013;
  --ok:#54C486; --ok-soft:#102A1B;
  --warn:#E0AC4C; --warn-soft:#2E2411;
  --bad:#EE7176; --bad-soft:#301618;
  --info:#87A6F0; --info-soft:#161F34;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.45);
  --shadow-sm:0 1px 3px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#0C1116; --panel:#151C23; --panel-2:#1B232B; --panel-3:#242E38;
  --line:#2A343F; --line-2:#3B4854;
  --ink:#E6ECF2; --ink-2:#A6B4C1; --ink-3:#71818F;
  --acc:#E692AE; --acc-soft:#31171F; --acc-line:#71384C; --acc-ink:#1D1013;
  --ok:#54C486; --ok-soft:#102A1B;
  --warn:#E0AC4C; --warn-soft:#2E2411;
  --bad:#EE7176; --bad-soft:#301618;
  --info:#87A6F0; --info-soft:#161F34;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.45);
  --shadow-sm:0 1px 3px rgba(0,0,0,.55);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:7px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ══ 셸 ══════════════════════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100dvh;min-height:0}

#top{
  display:flex;align-items:center;gap:9px;padding:0 12px;min-height:var(--topH);
  background:var(--panel);border-bottom:1px solid var(--line);
  flex:0 0 auto;z-index:40;box-shadow:var(--shadow-sm);
}
.brand{font-weight:700;font-size:17px;letter-spacing:-.4px;flex:0 0 auto;user-select:none}
#top .grow{flex:1 1 auto;min-width:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap);padding:0 15px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:15px;font-weight:600;white-space:nowrap;transition:.12s;
}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:36px;padding:0 11px;font-size:13.5px;font-weight:500}
.btn.ico{padding:0;width:var(--tap);font-size:20px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

select{
  min-height:var(--tap);padding:0 30px 0 12px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:15px;font-weight:600;max-width:100%;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) calc(50% + 2px),calc(100% - 12px) calc(50% + 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
input[type=search],input[type=text]{
  min-height:var(--tap);padding:0 12px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm);font-size:16px;width:100%;
}

/* ══ 본문 ════════════════════════════════════════════════════════ */
#main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.pane{min-height:0;min-width:0;display:none;flex-direction:column;overflow:hidden;background:var(--panel)}
.pane.active{display:flex}
.pane-hd{
  display:flex;align-items:center;gap:8px;padding:9px 12px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:var(--panel);min-height:52px;
}
.pane-hd h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px}
.pane-bd{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pane-ft{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:10px 12px}

.seg{display:flex;gap:2px;background:var(--panel-3);padding:3px;border-radius:10px}
.seg button{
  padding:0 14px;min-height:34px;border-radius:8px;font-size:14px;font-weight:600;
  color:var(--ink-2);transition:.12s;
}
.seg button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ══ 하단 탭 ═════════════════════════════════════════════════════ */
#nav{
  display:flex;flex:0 0 auto;min-height:var(--navH);background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40;
}
#nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:11.5px;font-weight:600;padding:6px 0;
}
#nav button .g{font-size:20px;line-height:1}
#nav button[aria-selected=true]{color:var(--acc)}

/* ══ 처방표 ══════════════════════════════════════════════════════ */
.phase-hd{
  display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:var(--panel-3);border-bottom:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink-2);position:sticky;top:0;z-index:3;
}
.phase-hd .pdot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.phase-hd .amt{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--ink-3);font-size:12.5px}

.frow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.frow .nm{flex:1 1 auto;min-width:0;cursor:pointer}
.frow .nm b{display:block;font-size:15px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .nm small{font-size:12px;color:var(--ink-3);font-family:var(--mono);
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .nm .over{color:var(--warn);font-family:var(--sans);font-weight:600}
.frow .gv{font-family:var(--mono);font-size:12px;color:var(--ink-3);
  flex:0 0 auto;width:72px;text-align:right}
.frow .del{width:36px;height:36px;flex:0 0 auto;color:var(--ink-3);font-size:18px;border-radius:8px}
.frow .del:hover{background:var(--bad-soft);color:var(--bad)}

/* ══ 휠 스테퍼 ═══════════════════════════════════════════════════ */
.stp{
  display:inline-flex;align-items:stretch;flex:0 0 auto;
  border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
  overflow:hidden;user-select:none;
}
.stp button{
  width:38px;flex:0 0 auto;font-size:21px;font-weight:400;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.stp button:hover{background:var(--panel-3);color:var(--ink)}
.stp button:active{background:var(--acc-soft);color:var(--acc)}
.stp .v{
  min-width:80px;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:2px;
  background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
  cursor:ns-resize;position:relative;touch-action:none;
}
.stp .v b{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.3px}
.stp .v em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:500}
.stp .v input{
  width:100%;border:0;background:none;text-align:center;font-family:var(--mono);
  font-size:16px;font-weight:600;padding:0;min-height:0;height:100%;
}
.stp.drag .v{background:var(--acc-soft)}
.stp.lg{border-radius:12px}
.stp.lg button{width:54px;font-size:27px}
.stp.lg .v{min-width:124px}
.stp.lg .v b{font-size:25px}
.stp.sm button{width:32px;font-size:18px}
.stp.sm .v{min-width:64px}
.stp.sm .v b{font-size:14px}

/* ══ 원료 고르기 오버레이 ════════════════════════════════════════ */
#picker{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;
  background:rgba(14,22,30,.45);backdrop-filter:blur(3px)}
#picker .box{
  background:var(--panel);display:flex;flex-direction:column;flex:1 1 auto;min-height:0;
  box-shadow:var(--shadow);
}
#picker .phd{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
#picker .phd b{font-size:17px;font-weight:700;flex:0 0 auto}
.srch{position:relative;flex:1 1 auto}
.srch input{padding-left:38px;padding-right:40px}
.srch .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);font-size:17px;pointer-events:none}
.srch .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:8px;color:var(--ink-3);font-size:16px}

.chips{display:flex;gap:7px;padding:9px 12px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);
  background:var(--panel-2);font-size:13.5px;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
}
.chip[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

.ilist{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.irow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line)}
.irow.on{background:var(--acc-soft)}
.irow .bar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto;min-height:40px}
.irow .txt{flex:1 1 auto;min-width:0;cursor:pointer}
.irow .n1{font-size:15px;font-weight:600;line-height:1.35}
.irow .n2{font-size:12px;color:var(--ink-3);font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .n3{font-size:12.5px;color:var(--ink-2);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.irow .act{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.irow .addb{
  min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--acc-line);
  background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:13.5px;white-space:nowrap;
}
.irow .addb:hover{background:var(--acc);color:var(--acc-ink)}
.irow .info{width:34px;height:34px;border-radius:8px;color:var(--ink-3);font-size:16px;flex:0 0 auto}
.irow .info:hover{background:var(--panel-3);color:var(--ink)}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:15px;line-height:1.9}

/* ══ 공정 ════════════════════════════════════════════════════════ */
.step{border-bottom:1px solid var(--line);padding:11px 12px}
.step-hd{display:flex;align-items:center;gap:10px}
.step-hd .no{
  width:28px;height:28px;border-radius:50%;background:var(--panel-3);color:var(--ink-2);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;font-family:var(--mono);
}
.step-hd .ttl{flex:1 1 auto;font-size:15px;font-weight:600;min-width:0}
.step-par{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
.parlab{font-size:12px;color:var(--ink-3);font-weight:600}
.step-add{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--panel-3);
  color:var(--ink-2);font-weight:500}
.step-note{margin-top:9px;font-size:13px;color:var(--ink-2);line-height:1.65;
  border-left:3px solid var(--line-2);padding-left:10px}

/* ══ 결과 ════════════════════════════════════════════════════════ */
.res{padding:12px}
.hero{
  display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:12px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
}
.hero .info{flex:1 1 auto;min-width:0}
.hero .verdict{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.5px}
.hero .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.hero .badge{display:inline-flex;align-items:center;gap:5px;margin-top:9px;
  padding:5px 12px;border-radius:14px;font-size:12.5px;font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}

.mets{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.met{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.met .k{font-size:12px;color:var(--ink-3);font-weight:600}
.met .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.6px}
.met .u{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:3px}
.met .r{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-top:1px}
.met.ok{border-color:var(--ok);background:var(--ok-soft)}
.met.bad{border-color:var(--bad);background:var(--bad-soft)}
.gauge{height:6px;border-radius:3px;background:var(--panel-3);margin-top:7px;position:relative;overflow:hidden}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.3}
.gauge .mark{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;background:var(--ink)}

.acc{border:1px solid var(--line);border-radius:var(--r-sm);margin-top:10px;overflow:hidden;background:var(--panel)}
.acc>summary{
  list-style:none;padding:12px 14px;display:flex;align-items:center;gap:9px;cursor:pointer;
  font-size:14.5px;font-weight:600;background:var(--panel-2);
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'⌄';margin-left:auto;color:var(--ink-3);font-size:17px;transition:.15s}
.acc[open]>summary::after{transform:rotate(180deg)}
.acc>summary .cnt{font-size:12px;font-weight:700;padding:2px 9px;border-radius:11px;
  background:var(--panel-3);color:var(--ink-2)}
.acc>summary .cnt.bad{background:var(--bad-soft);color:var(--bad)}
.acc>summary .cnt.ok{background:var(--ok-soft);color:var(--ok)}
.acc .body{padding:12px 14px;border-top:1px solid var(--line)}

.note{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-sm);margin-bottom:8px;
  font-size:13.5px;line-height:1.65;border:1px solid transparent}
.note:last-child{margin-bottom:0}
.note .sv{font-family:var(--mono);font-size:12px;font-weight:700;flex:0 0 auto;padding-top:1px;min-width:26px}
.note b{display:block;font-size:13.5px;margin-bottom:2px}
.note.s3{background:var(--bad-soft);border-color:var(--bad)}
.note.s2{background:var(--warn-soft);border-color:var(--warn)}
.note.s1{background:var(--info-soft);border-color:var(--info)}
.note.good{background:var(--ok-soft);border-color:var(--ok)}

.kv{display:flex;flex-wrap:wrap;gap:7px}
.kv span{font-size:12.5px;font-family:var(--mono);color:var(--ink-2);
  background:var(--panel-2);border:1px solid var(--line);padding:4px 9px;border-radius:7px}

table.rec{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
table.rec th{text-align:right;font-weight:700;color:var(--ink-3);padding:6px 7px;
  border-bottom:1px solid var(--line-2);font-size:11.5px}
table.rec th:first-child{text-align:left}
table.rec td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.rec td:first-child{text-align:left;font-family:var(--sans);white-space:normal}
table.rec td.hi{color:var(--bad);font-weight:700}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

.tlrow{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:4px 0}
.tlrow .tt{width:52px;flex:0 0 auto;font-family:var(--mono);color:var(--ink-3);text-align:right}
.tlbar{flex:1 1 auto;height:18px;border-radius:4px;background:var(--panel-3);position:relative;overflow:hidden}
.tlbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.tlrow .tn{width:104px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}

/* ══ 학습 ════════════════════════════════════════════════════════ */
.chapter{border-bottom:1px solid var(--line)}
.ch-hd{display:flex;align-items:center;gap:12px;padding:14px 12px;width:100%;text-align:left}
.ch-hd .ic{font-size:24px;flex:0 0 auto;line-height:1}
.ch-hd .t{flex:1 1 auto;min-width:0}
.ch-hd .t b{display:block;font-size:15.5px;font-weight:700}
.ch-hd .t small{font-size:12.5px;color:var(--ink-3)}
.ch-hd .pg{font-family:var(--mono);font-size:13px;color:var(--ink-3);flex:0 0 auto;font-weight:600}
.prog{height:4px;background:var(--panel-3);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:2px}
.mrow{display:flex;align-items:center;gap:11px;padding:12px 12px 12px 40px;
  border-top:1px solid var(--line);background:var(--panel-2);width:100%;text-align:left}
.mrow .st{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;
  background:var(--panel-3);color:var(--ink-3);font-family:var(--mono)}
.mrow .st.done{background:var(--ok);color:#fff}
.mrow .tx{flex:1 1 auto;min-width:0}

function cl(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smooth(x, a, b) { if (x <= a) return 0; if (x >= b) return 1; var t = (x - a) / (b - a); return t * t * (3 - 2 * t); }

/* Lab → sRGB hex (D65) */
function labToRgb(L, A, B) {
  var y = (L + 16) / 116, x = A / 500 + y, z = y - B / 200;
  var f = function (t) { var t3 = t * t * t; return t3 > 0.008856 ? t3 : (t - 16 / 116) / 7.787; };
  var X = f(x) * 0.95047, Y = f(y) * 1.00000, Z = f(z) * 1.08883;
  var r = X * 3.2406 + Y * -1.5372 + Z * -0.4986,
      g = X * -0.9689 + Y * 1.8758 + Z * 0.0415,
      b = X * 0.0557 + Y * -0.2040 + Z * 1.0570;
  var s = function (c) { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(Math.max(c, 0), 1 / 2.4) - 0.055; return Math.round(cl(c, 0, 1) * 255); };
  var h = function (v) { var t = v.toString(16); return t.length < 2 ? '0' + t : t; };
  return '#' + h(s(r)) + h(s(g)) + h(s(b));
}

/* =====================================================================
   1. 조성 집계
   ===================================================================== */
function composition(rows) {
  var a = {
    total: 0, water: 0, polyol: 0, oil: 0, wax: 0, powder: 0,
    emul: 0, emulHi: 0, emulLo: 0, surf: 0, surfActive: 0, cond: 0,
    lam: 0, salt: 0, saltAdd: 0, etoh: 0, nacl: 0, thickGel: 0,
    oilVol: 0, watVol: 0, pwdVol: 0, totVol: 0,
    riOil: 0, riWat: 0, cost: 0, rhSum: 0, rhW: 0, hlbSum: 0, hlbW: 0,
    thickers: [], colors: [], byCat: {}, rows: []
  };
  /* 알칼리가 있으면 지방산은 그 자리에서 비누가 된다 — 오일이 아니라 계면활성제 */
  var FATTY = ['myristic', 'lauric', 'stearic'];
  var alkali = rows.some(function (r) {
    return r.pct > 0 && ['koh', 'naoh', 'tea', 'arginine', 'tromet'].indexOf(r.id) >= 0;
  });
  a.soap = alkali && rows.some(function (r) { return r.pct > 0 && FATTY.indexOf(r.id) >= 0; });

  var rawTotal = rows.reduce(function (x, y) { return x + (+y.pct > 0 ? +y.pct : 0); }, 0);
  var norm = rawTotal > 0 ? 100 / rawTotal : 1;
  a.rawTotal = rawTotal;

  rows.forEach(function (r) {
    var g = ING.BY[r.id]; if (!g || !(r.pct > 0)) return;
    var c = r.pct * norm;                     /* 100% 기준으로 환산 */
    var saponified = a.soap && FATTY.indexOf(g.id) >= 0;
    a.total += c;
    a.cost += c / 100 * g.pr;
    a.byCat[g.cat] = (a.byCat[g.cat] || 0) + c;
    a.rows.push({ g: g, c: c });

    var vol = c / g.d;
    a.totVol += vol;
    a.salt += (g.el || 0) * c;

    if (g.id === 'naclthick') a.nacl += c;
    if (g.id === 'etoh') a.etoh += c;

    var isEmul = saponified || (g.cat === 'emul') ||
                 (g.hlb > 0 && ['surf', 'presv', 'thick'].indexOf(g.cat) < 0) ||
                 (g.cat === 'cond' && g.lam > 0);
    var oily = !saponified && ((g.sol === 'o') || (g.cat === 'wax') || (g.cat === 'oil') || (g.cat === 'sili'));
    var pwd = (g.sol === 'd');

    if (pwd) { a.powder += c; a.pwdVol += vol; }
    else if (oily) {
      a.oilVol += vol;
      if (g.cat === 'wax') a.wax += c; else a.oil += c;
      if (g.rh > 0 && !isEmul) { a.rhSum += g.rh * c; a.rhW += c; }
      if (!a.riOil) a.riOil = 0;
      a.riOil += g.ri * vol;
    } else {
      a.watVol += vol;
      if (g.cat === 'water' || g.cat === 'humect') { a.water += c; if (g.id !== 'aqua') a.polyol += c; }
      a.riWat += g.ri * vol;
    }

    a.lam += (g.lam || 0) * c;

    /* 유화제 풀 — 양이온 컨디셔닝제(BTMS)도 실제로는 유화제로 작동한다 */
    if (isEmul) {
      a.emul += c;
      var h = saponified ? 18 : (g.hlb > 0 ? g.hlb : 15);
      a.hlbSum += h * c; a.hlbW += c;
      if (h >= 8) a.emulHi += c; else a.emulLo += c;
    }
    if (g.cat === 'surf') { a.surf += c; a.surfActive += c * surfActivity(g.id); }
    if (g.cat === 'cond') a.cond += c;
    /* 계면활성제 자신의 대이온은 "추가 전해질"이 아니다 (솔트 커브용) */
    if (['surf', 'cond'].indexOf(g.cat) < 0) a.saltAdd += (g.el || 0) * c;
    if (g.th) a.thickers.push({ g: g, c: c });
    if (g.tint > 0.05) a.colors.push({ g: g, c: c });
  });

  a.riOil = a.oilVol > 0 ? a.riOil / a.oilVol : 1.46;
  a.riWat = a.watVol > 0 ? a.riWat / a.watVol : 1.333;
  a.dn = Math.abs(a.riOil - a.riWat);
  a.phi = a.totVol > 0 ? (a.oilVol + a.pwdVol) / a.totVol : 0;   /* 내상 부피분율 */
  a.aqueous = a.water + a.surf * 0.6;
  a.anhydrous = a.water < 5;
  return a;
}

/* 계면활성제 원료의 활성분 비율 */
function surfActivity(id) {
  return { sles: 0.70, capb: 0.30, chs: 0.50, slmi: 0.85, cocoglut: 0.30,
           decylglu: 0.50, lauryglu: 0.50, myristic: 1.0, lauric: 1.0 }[id] || 0.5;
}

/* =====================================================================
   2. pH — 산·염기 적정 + 완충 가중 평균
   ===================================================================== */
function pH(rows) {
  var A = 0, B = 0, pkaS = 0, pka0S = 0, nS = 0, w = 0;
  var pvS = 0, pcS = 0;
  var rt = rows.reduce(function (x, y) { return x + (+y.pct > 0 ? +y.pct : 0); }, 0);
  var nz = rt > 0 ? 100 / rt : 1;
  rows.forEach(function (r) {
    var g = ING.BY[r.id]; if (!g || !(r.pct > 0)) return;
    var pct = r.pct * nz;
    var t = AB[r.id];
    if (t) {
      if (t.aeq) {
        var m = t.aeq * pct;                   /* 100 g 기준 mmol */
        A += m; pkaS += t.pka * m; pka0S += t.pka0 * m; nS += t.n * m; w += m;
      }
      if (t.beq) B += t.beq * pct;
    }
    if (g.pc > 0) { pvS += g.pv * g.pc * pct; pcS += g.pc * pct; }
  });

  var pHw = pcS > 0 ? pvS / pcS : 6.5;
  if (A + B < 0.02) return cl(pHw, 2, 12);

  var pka = w > 0 ? pkaS / w : 4.5,
      pka0 = w > 0 ? pka0S / w : 4.5,
      n = w > 0 ? nS / w : 1.0;
  var pHab;

  if (A < 0.01) {                               /* 산 없음 — 잔여 염기 */
    pHab = 14 + Math.log(Math.max(B, 1e-6) / 1000 / 0.1) / Math.LN10;
  } else {
    var alpha = B / A;
    if (alpha <= 0.03) {
      /* 미중화 약산 : pH = ½(pKa − log C) */
      pHab = 0.5 * (pka - Math.log(A / 1000 / 0.1) / Math.LN10);
    } else {
      /* Henderson–Hasselbalch. 폴리전해질은 n>1 로 완만해진다 */
      var al = cl(alpha, 0.03, 0.985);
      pHab = pka0 + n * Math.log(al / (1 - al)) / Math.LN10;
      if (alpha > 1) pHab += Math.min(3.2, 4 * (alpha - 1));   /* 과중화 */
    }
  }
  /* 완충 성분(계면활성제·아미노산·추출물)이 많을수록 적정 결과가 희석된다 */
  var wt = cl((A + B) / ((A + B) + 0.6 * pcS + 0.05), 0, 1);
  return cl(wt * pHab + (1 - wt) * pHw, 1.2, 13.5);
}

/* 카보머 중화도(0~1) — 겔 활성 계산용 */
function neutralDegree(rows) {
  var A = 0, B = 0;
  var rt = rows.reduce(function (x, y) { return x + (+y.pct > 0 ? +y.pct : 0); }, 0);
  var nz = rt > 0 ? 100 / rt : 1;
  rows.forEach(function (r) {
    var t = AB[r.id]; if (!t) return;
    if (t.aeq && (r.id === 'carb940' || r.id === 'pemulen')) A += t.aeq * r.pct * nz;
    if (t.beq) B += t.beq * r.pct * nz;
  });
  if (A <= 0) return 0;
  return cl(B / A, 0, 1.4);
}

/* 카보머를 목표 pH 까지 올리는 데 필요한 중화제 양(%) */
function neutralizerNeeded(rows, agentId, targetPh) {
  var t = AB[agentId]; if (!t || !t.beq) return 0;
  var A = 0, pka0 = 4.8, n = 2.0, w = 0;
  rows.forEach(function (r) {
    var q = AB[r.id]; if (!q || !q.aeq) return;
    var m = q.aeq * r.pct; A += m; pka0 += 0; w += m;
    pka0 = q.pka0; n = q.n;
  });
  if (A <= 0) return 0;
  var tp = targetPh || 6.3;
  var alpha = cl(1 / (1 + Math.pow(10, (pka0 - tp) / n)), 0.05, 0.95);
  return +(A * alpha / t.beq).toFixed(4);
}

/* =====================================================================
   3. 액적 크기 d32 (µm)
   ===================================================================== */
function dropletSize(a, p) {
  if (a.oil + a.wax < 0.02 || a.water < 5) return 0;
  var oilTot = a.oil + a.wax;

  /* 요구 HLB vs 유화제 혼합 HLB */
  var rh = a.rhW > 0 ? a.rhSum / a.rhW : 10;
  var bh = a.hlbW > 0 ? a.hlbSum / a.hlbW : 0;
  var match = a.emul > 0 ? Math.exp(-Math.pow(bh - rh, 2) / 8) : 0;
  /* 가용화(미셀 내부에 오일을 품는 것)는 HLB 가 조금 어긋나도 작동한다 */
  var matchSol = a.emul > 0 ? Math.exp(-Math.pow(bh - rh, 2) / 40) : 0;

  /* 계면장력 (mN/m) */
  var polymerAssist = 0;
  a.thickers.forEach(function (t) { if (t.g.hlb > 0) polymerAssist += t.c * 3.0; });
  var rEff = (a.emul * match + polymerAssist) / Math.max(oilTot, 0.02);
  var rSol = (a.emul * matchSol + polymerAssist + a.surfActive * 0.8 + a.cond * 0.3) /
             Math.max(oilTot, 0.02);
  var sigma = Math.max(0.4, 30 / (1 + 40 * rEff));

  /* 전단 한계 */
  var U = Math.max(p.tip || 0.5, 0.15);
  var fPhi = 1 + 1.5 * a.phi;
  var fEta = cl(Math.pow(Math.max(p.etaC || 20, 1) / 50, -0.15), 0.65, 1.6);
  var dEq = 5.11 * Math.pow(sigma, 0.6) * Math.pow(U, -1.2) * fPhi * fEta;
  var tau = 90;                                            /* s */
  var dShear = dEq * (1 + 3 * Math.exp(-(p.sec || 60) / tau));

  /* 유화제 피복 한계 : d = Γ·6φ / (질량농도) */
  var cover = a.emul * Math.max(match, 0.2) + polymerAssist + a.surfActive * 0.8 + a.cond * 0.3;
  var dCover = cover > 0.01 ? 3e-6 * 6 * a.phi / (10 * cover) * 1e6 : 999;

  /* 가용화 : 계면활성제가 오일보다 훨씬 많으면 전단과 무관하게
     10~40 nm 미셀이 스스로 만들어져 투명해진다 */
  var solub = smooth(rSol, 1.5, 3.0);
  var dSolub = solub > 0.001 ? (0.012 + 0.08 / Math.max(rSol, 0.1)) / solub : 1e9;

  var d = Math.max(dCover, Math.min(dShear, dSolub));
  return { d: cl(d, 0.012, 200), dShear: dShear, dCover: dCover, dSolub: dSolub,
           sigma: sigma, rh: rh, bh: bh, match: match, rEff: rEff, rSol: rSol, solub: solub,
           minor: oilTot < 0.5,
           starved: dCover > Math.min(dShear, dSolub) * 1.15 };
}

/* =====================================================================
   4. 점도 (cP, 25℃, 12 rpm 기준)
   ===================================================================== */
function viscosity(a, env) {
  var ph = env.pH, d32 = env.d32 || 1, alpha = env.alpha || 0;

  /* (1) 용매 점도 — 폴리올 */
  var etaSolv = Math.exp(0.035 * a.polyol);

  /* (2) 점증제 겔 */
  var gel = 0, gelDetail = [];
  var E = a.salt;
  a.thickers.forEach(function (t) {
    var g = t.g, K = g.th[0], n = g.th[1], eff = 1;
    if (g.id === 'carb940' || g.id === 'pemulen') {
      var fp = smooth(ph, 3.9, 5.6) * (1 - smooth(ph, 8.5, 11));
      var fa = cl(alpha / 0.35, 0, 1);
      eff = Math.min(fp, Math.max(fa, fp * 0.15)) / (1 + 1.9 * E) / (1 + 0.06 * a.etoh);
    } else if (g.id === 'xanthan' || g.id === 'sclero' || g.id === 'gellan' || g.id === 'carrag') {
      eff = (1 - smooth(ph, 11, 13)) / (1 + 0.06 * E) / (1 + 0.02 * a.etoh);
    } else if (g.id === 'hec' || g.id === 'ha' || g.id === 'pq10' || g.id === 'guar') {
      eff = 1 / (1 + 0.03 * E) / (1 + 0.03 * a.etoh);
    } else if (g.id === 'peg150ds') {
      eff = Math.min(1, a.surfActive / 6);
    } else if (g.id === 'napolyacr') {
      eff = smooth(ph, 4.5, 6) / (1 + 0.9 * E);
    } else {                                        /* 아리스토플렉스 · 세피노브 · 시뮬젤 */
      eff = smooth(ph, 3, 4.5) * (1 - smooth(ph, 9, 11)) / (1 + 0.35 * E);
    }
    var v = K * Math.pow(Math.max(t.c, 0.001), n) * eff;
    gel += v;
    gelDetail.push({ ko: g.ko, v: v, eff: eff });
  });

  /* (3) 계면활성제 미셀 점도 (샴푸·바디워시) */
  var surfV = 0;
  if (a.surfActive > 4) {
    var s = a.nacl + a.saltAdd * 0.045;
    var saltF = 1 + 16 * s * Math.exp(-s / 1.6);
    surfV = 6.5 * Math.pow(a.surfActive, 1.6) * saltF;
    if (a.cond > 0.2) surfV *= 1 + 0.25 * a.cond;
  }

  /* (4) 라멜라 겔망 (지방알코올 × 유화제) */
  var lamV = 0;
  if (a.lam > 0.05) {
    /* 890·L^2.29 : 세테아릴 1.2 + 유화제 2.0 → 6천 cP(로션),
       세테아릴 3 + 유화제 3 → 3만 cP(크림) 두 점에 맞춘 곡선 */
    var support = cl((a.emul + a.cond * 0.8 + a.surfActive * 0.15) / (0.30 * a.lam), 0, 1);
    lamV = 890 * Math.pow(a.lam, 2.29) * support;
    lamV *= (env.coolFactor || 1);
  }

  /* (5) 내상 부피분율 — Krieger–Dougherty */
  var phiEff = a.phi * Math.pow(1 + 0.02 / Math.max(d32, 0.05), 3);
  var phim = 0.72;
  var KD = Math.pow(1 - Math.min(phiEff, 0.985 * phim) / phim, -1.8);

  /* (6) 무수 제형 */
  var eta;
  if (a.anhydrous) {
    var ov = 0, ow = 0;
    a.rows.forEach(function (r) {
      var v = OILV[r.g.id]; if (v == null) v = (r.g.sol === 'o' ? 40 : 20);
      ov += Math.log(v) * r.c; ow += r.c;
    });
    eta = ow > 0 ? Math.exp(ov / ow) : 30;
    if (a.wax > 0.5) eta *= Math.pow(1 + a.wax, 2.6);
    if (a.powder > 0.5) eta *= Math.pow(1 - Math.min(a.pwdVol / a.totVol, 0.5) / 0.62, -1.8);
  } else {
    eta = (etaSolv + gel + surfV) * KD + lamV;
  }

  /* (7) 전단감점 지수 n */
  var struct = gel + lamV + surfV * 0.4;
  var frac = struct / Math.max(eta, 1);
  var nIdx = cl(1 - 0.78 * frac, 0.16, 1);

  /* (8) 항복응력 (Pa) — 파우더·액적 부유 판정 */
  var yieldS = gel > 20 ? 0.06 * Math.pow(gel, 0.72) : 0;
  if (lamV > 500) yieldS += 0.04 * Math.pow(lamV, 0.72);   /* 라멜라가 액적을 붙든다 */
  if (a.thickers.some(function (t) { return t.g.id === 'xanthan' || t.g.id === 'gellan'; })) yieldS *= 2.2;

  return { eta: eta, gel: gel, lam: lamV, surfV: surfV, KD: KD, n: nIdx,
           yieldStress: yieldS, detail: gelDetail, phiEff: phiEff };
}

/* Brookfield rpm 별 겉보기 점도 */
function apparent(eta12, n, rpm) {
  return eta12 * Math.pow((rpm || 12) / 12, n - 1);
}

/* =====================================================================
   5. 탁도 (NTU)
   ===================================================================== */
function turbidity(a, env) {
  var ntu = 0, src = [];

  /* 파우더·무기입자 */
  var pw = 0;
  a.rows.forEach(function (r) { if (r.g.op > 0 && r.g.sol === 'd') pw += r.g.op * r.c; });
  if (pw > 0) { ntu += pw; src.push({ ko: '파우더·무기입자', v: pw }); }

  /* 유화 액적 */
  if (a.phi > 0.001 && env.d32 > 0) {
    var x = env.d32 / 0.12;
    var x4 = Math.pow(x, 4);
    var s = 3.5 * x4 / ((1 + x4) * (1 + 0.25 * x));
    var e = 5.5e4 * a.phi * Math.pow(a.dn / 0.137, 2) * s;
    ntu += e; src.push({ ko: '유화 액적 산란', v: e });
  }

  /* 미셀·고분자 자체 탁도 */
  var mz = 0;
  a.rows.forEach(function (r) { if (r.g.op > 0 && r.g.sol !== 'd') mz += r.g.op * r.c; });
  if (a.anhydrous) mz *= 0.12;                    /* 물이 없으면 미셀 산란도 없다 */
  if (mz > 0) { ntu += mz; src.push({ ko: '용해 원료 자체 탁도', v: mz }); }

  /* 석출 결정 */
  if (env.precipitate > 0) { ntu += env.precipitate; src.push({ ko: '결정 석출·미용해', v: env.precipitate }); }

  /* 기포 */
  if (env.airPct > 0) { var b = 60 * env.airPct; ntu += b; src.push({ ko: '혼입 기포', v: b }); }

  ntu = Math.max(ntu, 0.3);
  return { ntu: ntu, grade: grade(ntu), src: src };
}

function grade(n) {
  if (n < 5) return '투명';
  if (n < 40) return '미탁';
  if (n < 300) return '반투명';
  if (n < 2000) return '유백';
  return '불투명';
}

/* =====================================================================
   6. 색상
   ===================================================================== */
function color(a, env) {
  var L = 0, A = 0, B = 0, W = 0;
  a.rows.forEach(function (r) {
    var w = r.g.tint * r.c;
    if (w <= 0) return;
    L += r.g.lab[0] * w; A += r.g.lab[1] * w; B += r.g.lab[2] * w; W += w;
  });
  /* 산란에 의한 백색 */
  var white = 9 * Math.min(1, (env.ntu || 0) / 600);
  L += 97 * white; A += -0.4 * white; B += 1.2 * white; W += white;
  /* 무색 베이스 */
  L += 99 * 3; A += -0.3 * 3; B += 0.6 * 3; W += 3;

  L /= W; A /= W; B /= W;

  /* 갈변 · 산화 */
  var br = env.browning || 0;
  L -= br * 0.85; A += br * 0.38; B += br * 1.0;

  L = cl(L, 8, 100); A = cl(A, -60, 70); B = cl(B, -60, 90);
  return { L: L, a: A, b: B, hex: labToRgb(L, A, B), browning: br };
}

/* =====================================================================
   7. 안정성 진단
   ===================================================================== */
function stability(a, env) {
  var items = [], score = 100;
  function bad(sev, ko, msg) { items.push({ sev: sev, ko: ko, msg: msg }); score -= sev; }

  var dp = env.drop, v = env.visc, ph = env.pH;

  if (a.oil + a.wax > 1 && a.water > 5) {
    /* HLB */
    if (dp && a.emul > 0.05 && a.rhW > 0.5) {

    case 'count': return st.rows.filter(function (x) { return x.pct > 0; }).length;
    case 'total100': return st.rows.reduce(function (x, y) { return x + (+y.pct || 0); }, 0);
    case 'maxCat': case 'minCat': return catSum(c.cat);
    case 'hasCat': case 'noCat': return catSum(c.cat);
    case 'warnMax': return run.warn.reduce(function (x, y) { return x + y.sev; }, 0);
    case 'clean': return run.warn.filter(function (w) { return w.sev >= c.sev; }).length;
    case 'preserve': return r.preserve;
    case 'salt':  return a.salt;
    case 'time':  return run.minutes;
    case 'temp':  return run.maxT;
    case 'evap':  return run.evapPct;
    case 'alpha': return r.alpha;
    case 'homog': return run.homog;
    case 'water': return catSum('water') + (a.byCat.humect || 0) * 0;
    case 'air':   return run.airPct;
    case 'ingErr': {
      var it = (run.items || []).filter(function (x) { return x.id === c.id; })[0];
      return it ? Math.abs(it.rel) : 1;
    }
    case 'color': {
      var L = r.color;
      return Math.sqrt(Math.pow(L.L - c.lab[0], 2) + Math.pow(L.a - c.lab[1], 2) + Math.pow(L.b - c.lab[2], 2));
    }
  }
  return 0;
}

function pass(c, run, st, prod) {
  var v = value(c, run, st);
  switch (c.k) {
    case 'spec':  return G.PROD.judge(prod, run.res).ok;
    case 'has':   return st.rows.some(function (x) { return x.id === c.id && x.pct > 0; });
    case 'no':    return !st.rows.some(function (x) { return x.id === c.id && x.pct > 0; });
    case 'hasCat':return v > 0;
    case 'noCat': return v <= 0.0001;
    case 'clean': return v === 0;
    case 'total100': return Math.abs(v - 100) < 0.02;
    case 'color': return v <= c.de;
  }
  if (c.lo != null && v < c.lo) return false;
  if (c.hi != null && v > c.hi) return false;
  return true;
}

function display(c, run, st) {
  var v = value(c, run, st);
  switch (c.k) {
    case 'spec': return '';
    case 'has': case 'no': return '';
    case 'hasCat': case 'noCat': return v.toFixed(2) + '%';
    case 'clean': return v + '건';
    case 'ph': case 'alpha': return c.k === 'alpha' ? Math.round(v * 100) + '%' : v.toFixed(2);
    case 'd32': return v ? v.toFixed(2) + ' µm' : '—';
    case 'stab': case 'count': case 'warnMax': return Math.round(v) + '';
    case 'yield': case 'homog': case 'evap': case 'air': return v.toFixed(1) + '%';
    case 'preserve': return v.toFixed(2);
    case 'salt': return v.toFixed(2);
    case 'time': return Math.round(v) + '분';
    case 'temp': return Math.round(v) + '℃';
    case 'total100': return v.toFixed(2) + '%';
    case 'maxCat': case 'minCat': case 'water': return v.toFixed(2) + '%';
    case 'color': return 'ΔE ' + v.toFixed(1);
    case 'ingErr': return (v * 100).toFixed(2) + '%';
  }
  return Math.round(v).toLocaleString('ko-KR');
}

/* ── 채점 ──────────────────────────────────────────────────────── */
function grade(m, run, st) {
  var must = m.must.map(function (c) { return { c: c, ok: pass(c, run, st, m.ch), v: display(c, run, st), t: label(c, m.ch) }; });
  var bonus = (m.bonus || []).map(function (c) { return { c: c, ok: pass(c, run, st, m.ch), v: display(c, run, st), t: label(c, m.ch) }; });
  var mOk = must.every(function (x) { return x.ok; });
  var bHit = bonus.filter(function (x) { return x.ok; }).length;
  var score = mOk ? Math.round(70 + (bonus.length ? bHit / bonus.length * 30 : 30)) : 0;
  var g = !mOk ? '—' : score >= 95 ? 'S' : score >= 85 ? 'A' : score >= 78 ? 'B' : 'C';
  return { must: must, bonus: bonus, ok: mOk, score: score, grade: g, bHit: bHit };
}

/* ── 처방 변형 헬퍼 : 기준 처방에서 값을 바꿔 "고장난" 처방을 만든다 ── */
function mutate(prodKey, changes) {
  var base = G.PROD.get(prodKey).base.map(function (r) { return { id: r.id, pct: r.pct }; });
  (changes || []).forEach(function (ch) {
    var id = ch[0], v = ch[1];
    var row = base.filter(function (r) { return r.id === id; })[0];
    if (v === 0 || v == null) { base = base.filter(function (r) { return r.id !== id; }); return; }
    if (row) row.pct = v; else base.push({ id: id, pct: v });
  });
  return base;
}
/* 정제수로 100% 맞춰 돌려준다 */
function fix100(rows) {
  var other = rows.reduce(function (a, b) { return a + (b.id === 'aqua' ? 0 : b.pct); }, 0);
  var w = rows.filter(function (r) { return r.id === 'aqua'; })[0];
  if (w) w.pct = +(100 - other).toFixed(4);
  return rows;
}
function broken(prodKey, changes, keepTotal) {
  var r = mutate(prodKey, changes);
  return keepTotal === false ? r : fix100(r);
}

/* ── 과제 정의 ─────────────────────────────────────────────────── */
function M(ch, no, ko, type, brief, must, bonus, o) {
  var m = { ch: ch, no: no, ko: ko, type: type, brief: brief, must: must, bonus: bonus || [] };
  for (var k in (o || {})) m[k] = o[k];
  m.id = ch + '-' + no;
  return m;
}

(function (G) {

/* =====================================================================
   휠 스테퍼 — 버튼 · 마우스 휠 · 위아래 드래그 · 직접 입력
   ===================================================================== */
function smartStep(v, kind) {
  var a = Math.abs(v);
  if (kind === 'pct') {
    if (a < 0.05) return 0.001;
    if (a < 0.5)  return 0.01;
    if (a < 5)    return 0.1;
    if (a < 30)   return 0.5;
    return 1;
  }
  if (kind === 'rpm')  return a < 400 ? 50 : a < 2000 ? 100 : 250;
  if (kind === 'min')  return a < 10 ? 1 : 5;
  if (kind === 'temp') return 1;
  if (kind === 'g')    return a < 500 ? 50 : a < 5000 ? 500 : a < 100000 ? 5000 : 50000;
  return 1;
}
function decOf(step) {
  return step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
}
function snap(v, step) {
  var d = decOf(step);
  return +(Math.round(v / step) * step).toFixed(d);
}

/* opt : {kind, unit, min, max, cls, fmt, onChange} */
function stepper(value, opt) {
  opt = opt || {};
  var kind = opt.kind || 'pct',
      min = opt.min != null ? opt.min : 0,
      max = opt.max != null ? opt.max : 1e9;
  var val = value;

  var vb = el('b'), vu = opt.unit ? el('em', { text: opt.unit }) : null;
  var vbox = el('div.v', { title: '드래그하거나 휠을 굴려 조절 · 눌러서 직접 입력' }, [vb, vu]);
  var minus = el('button', { type: 'button', text: '−', 'aria-label': '줄이기' });
  var plus  = el('button', { type: 'button', text: '+', 'aria-label': '늘리기' });
  var box = el('div.stp' + (opt.cls ? '.' + opt.cls : ''), null, [minus, vbox, plus]);

  function show() {
    vb.textContent = opt.fmt ? opt.fmt(val) : String(val);
  }
  function commit(nv, silent) {
    nv = Math.max(min, Math.min(max, nv));
    var st = smartStep(nv, kind);
    nv = snap(nv, st);
    if (nv === val) { show(); return; }
    val = nv; show();
    if (!silent && opt.onChange) opt.onChange(val);
  }
  function bump(dir) {
    var st = smartStep(val + (dir > 0 ? 1e-9 : -1e-9), kind);
    /* 경계에서 단계가 바뀔 때 자연스럽게 */
    var nv = snap(val + dir * st, st);
    if (nv === val) nv = val + dir * st;
    commit(nv);
  }
  show();

  /* 버튼 — 길게 누르면 반복 */
  function hold(btn, dir) {
    var t1 = null, t2 = null;
    function stop() { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault(); bump(dir);
      t1 = setTimeout(function () { t2 = setInterval(function () { bump(dir); }, 70); }, 420);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
      btn.addEventListener(ev, stop);
    });
  }
  hold(minus, -1); hold(plus, 1);

  /* 마우스 휠 */
  box.addEventListener('wheel', function (e) {
    e.preventDefault();
    bump(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });

  /* 위아래 드래그 */
  var dragging = false, startY = 0, startV = 0, moved = 0;
  vbox.addEventListener('pointerdown', function (e) {
    if (vbox.querySelector('input')) return;
    dragging = true; moved = 0; startY = e.clientY; startV = val;
    vbox.setPointerCapture(e.pointerId);
    box.classList.add('drag');
  });
  vbox.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dy = startY - e.clientY;
    if (Math.abs(dy) > moved) moved = Math.abs(dy);
    var steps = Math.round(dy / 7);
    if (!steps) return;
    var st = smartStep(startV, kind);
    commit(startV + steps * st);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false; box.classList.remove('drag');
    try { vbox.releasePointerCapture(e.pointerId); } catch (err) {}
    if (moved < 4) edit();                 /* 움직이지 않았으면 = 탭 → 직접 입력 */

  vbox.addEventListener('pointerup', endDrag);
  vbox.addEventListener('pointercancel', endDrag);

  /* 직접 입력 */
  function edit() {
    if (vbox.querySelector('input')) return;
    var inp = el('input', { type: 'text', inputmode: 'decimal', value: String(val) });
    clear(vbox); vbox.appendChild(inp);
    inp.focus(); inp.select();
    function done(save) {
      var nv = parseFloat(inp.value);
      clear(vbox); vbox.appendChild(vb); if (vu) vbox.appendChild(vu);
      if (save && isFinite(nv)) commit(nv); else show();
    }
    inp.addEventListener('blur', function () { done(true); });

      if (e.key === 'ArrowDown') { e.preventDefault(); inp.value = String(val); bump(-1); inp.value = String(val); }
    });
  }

}

    box.appendChild(el('button.chip', {
      'aria-pressed': S.cat === c.k,
      onclick: function () { S.cat = S.cat === c.k ? '' : c.k; renderCats(); renderIngList(); }
    }, [el('span.dot', { style: 'background:' + c.c }), c.ko]));
  });
}

function pickerFoot() {
  var t = K.total();
  $('#ptotal').textContent = '처방 합계 ' + t.toFixed(2) + '% · ' + S.rows.length + '종';
  $('#ptotal').style.color = Math.abs(t - 100) < 0.02 ? 'var(--ok)' : 'var(--ink-3)';
}

function renderIngList() {
  var body = clear($('#ilist'));
  var list = ING.search(S.q, S.cat);
  $('#icount').textContent = list.length + ' / ' + ING.LIST.length + ' 종';
  $('#qClear').hidden = !S.q;
  pickerFoot();

  if (!list.length) {
    body.appendChild(el('div.empty', { html: '찾는 원료가 없습니다.<br>기능(보습 · 점증 · 유화)이나 제품명(샴푸 · 선크림)으로도 찾을 수 있습니다.' }));
    return;
  }

  list.slice(0, 300).forEach(function (g) {
    var row = S.rows.filter(function (r) { return r.id === g.id; })[0];
    var act = el('div.act');

    if (row) {
      act.appendChild(stepper(row.pct, {
        kind: 'pct', unit: '%', min: 0, max: 100, cls: 'sm', fmt: pctText,
        onChange: function (v) { row.pct = v; S.result = null; S.spread = null; pickerFoot(); }
      }));
      act.appendChild(el('button.info', {
        text: '✕', title: '빼기', 'aria-label': '빼기',
        onclick: function () { K.delRow(g.id); renderIngList(); K.toast(g.ko + ' 뺐습니다'); }
      }));
    } else {
      act.appendChild(el('button.addb', {
        text: '＋ ' + pctText(g.typ) + '%',
        title: '권장량으로 담기 — 담은 뒤 양을 자유롭게 바꿀 수 있습니다',
        onclick: function () {
          K.addRow(g.id, g.typ);
          renderIngList();
          K.toast(g.ko + ' ' + pctText(g.typ) + '% — 담은 뒤 조절하세요');
        }
      }));
      act.appendChild(el('button.info', {
        text: 'ⓘ', title: '설명', 'aria-label': '설명',
        onclick: function () { showIng(g); }
      }));
    }

    body.appendChild(el('div.irow' + (row ? '.on' : ''), null, [
      el('div.bar', { style: 'background:' + ING.catColor(g.cat) }),
      el('div.txt', { onclick: function () { showIng(g); } }, [
        el('div.n1', { text: g.ko }),
        el('div.n2', { text: g.inci }),
        el('div.n3', { text: g.n })
      ]),
      act
    ]));
  });
  if (list.length > 300)
    body.appendChild(el('div.empty', { text: '…외 ' + (list.length - 300) + '종. 검색어를 좁혀 주세요.' }));
}

function showIng(g) {
  var kv = el('div.kv');
  function add(t) { kv.appendChild(el('span', { text: t })); }
  add(ING.catName(g.cat));
  add('보통 ' + g.typ + '% (' + g.min + '~' + g.max + '%)');
  add('투입 ' + (ING.PHASES[g.ph] || {}).ko);
  add('밀도 ' + g.d);
  add('굴절률 ' + g.ri.toFixed(3));
  if (g.hlb) add('HLB ' + g.hlb);
  if (g.rh) add('요구 HLB ' + g.rh);
  if (g.th) add('점증 K=' + K.n0(g.th[0]) + ' n=' + g.th[1]);
  if (g.lam) add('라멜라 ' + g.lam);
  if (g.tmax) add('투입 ' + g.tmax + '℃ 이하');
  if (g.el) add('전해질 ' + g.el);
  if (g.vol) add('휘발 ' + g.vol);
  if (g.ox) add('산화 민감 ' + g.ox);
  add(K.n0(g.pr) + ' 원/kg');

  var cur = S.rows.filter(function (r) { return r.id === g.id; })[0];
  var amtBox = el('div', { style: 'display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 14px' });
  var start = cur ? cur.pct : g.typ;
  var stp = stepper(start, {
    kind: 'pct', unit: '%', min: 0, max: 100, cls: 'lg', fmt: pctText,
    onChange: function (v) { start = v; }
  });
  amtBox.appendChild(stp);

  var body = el('div', null, [
    el('div.rt', null, [
      el('p', { html: '<b>' + K.esc(g.inci) + '</b>' }),
      el('p', { text: g.n })
    ]),
    el('h3.sec', { text: '넣을 양' }),
    amtBox,
    el('div', { style: 'display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:6px' },
      [0.5, 1, 2, 4].map(function (m) {
        var v = +(g.typ * m).toFixed(3);
        return el('button.chip', { text: pctText(v) + '%', onclick: function () { start = v; stp.setValue(v); } });
      }).concat([
        el('button.chip', { text: '권장 상한 ' + g.max + '%', onclick: function () { start = g.max; stp.setValue(g.max); } })
      ])),
    el('div', { style: 'font-size:12.5px;color:var(--ink-3);text-align:center' },
      '권장 범위는 참고값입니다. 그 이상도 넣을 수 있고, 결과로 무슨 일이 생기는지 보여줍니다.'),
    el('h3.sec', { text: '물성' }),
    kv
  ]);

  var sh = K.sheet(g.ko, body, [
    cur ? el('button.btn', { text: '빼기', onclick: function () {
      K.delRow(g.id); sh.close(); renderIngList(); renderMid(); renderResult();
    } }) : null,
    el('button.btn.pri', { style: 'flex:1', text: cur ? '양 바꾸기' : '처방에 담기', onclick: function () {
      if (cur) cur.pct = start; else K.addRow(g.id, start);
      S.result = null;
      sh.close(); renderIngList(); renderMid(); renderResult();
      K.toast(g.ko + ' ' + pctText(start) + '%');
    } })
  ].filter(Boolean));
}

/* =====================================================================
   중간 패널
   ===================================================================== */
var MIDS = [{ k: 'form', ko: '처방' }, { k: 'proc', ko: '공정' }, { k: 'learn', ko: '학습' }];

function renderMid() {
  var tabs = clear($('#midtabs'));
  MIDS.forEach(function (m) {
    tabs.appendChild(el('button', {
      text: m.ko, 'aria-selected': S.mid === m.k,
      onclick: function () { S.mid = m.k; S.view = m.k; renderMid(); syncNav(); }
    }));
  });
  $('#midTitle').textContent = (MIDS.filter(function (m) { return m.k === S.mid; })[0] || {}).ko || '';
  clear($('#midTools')); clear($('#midFoot'));
  var body = clear($('#midBody'));
  if (S.mid === 'form') renderFormula(body);
  else if (S.mid === 'proc') renderProcess(body);
  else renderLearn(body);
}

/* ── 처방 ──────────────────────────────────────────────────────── */
function renderFormula(body) {
  $('#midTools').appendChild(el('button.btn.sm', {
    text: '기준 처방', title: '이 제품군의 표준 처방을 불러온다',
    onclick: function () {
      if (S.rows.length > 1 && !confirm('현재 처방을 " ' + PROD.get(S.prod).ko + ' 기준 처방" 으로 바꿉니다.')) return;
      K.setRows(PROD.get(S.prod).base); S.mission = null;
      renderAll(); persist(); K.toast('기준 처방을 불러왔습니다');
    }
  }));

  var real = S.rows.filter(function (r) { return r.pct > 0; });
  if (!real.length) {
    body.appendChild(el('div.empty', { html:
      '처방이 비어 있습니다.<br><br>아래 <b>＋ 원료 추가</b> 로 시작하거나,<br>위 <b>기준 처방</b> 을 불러오세요.' }));
  }

  ['A', 'E', 'B', 'D', 'C'].forEach(function (ph) {
    var rows = S.rows.filter(function (r) { var g = ING.BY[r.id]; return g && g.ph === ph; });
    if (!rows.length) return;
    var info = ING.PHASES[ph];
    var sum = rows.reduce(function (a, b) { return a + (+b.pct || 0); }, 0);
    body.appendChild(el('div.phase-hd', null, [
      el('span.pdot', { style: 'background:' + info.c }),
      ph + '상 · ' + info.ko,
      el('span.amt', { text: sum.toFixed(2) + '%  ·  ' + K.mass(S.batchG * sum / 100) })
    ]));
    rows.forEach(function (r) {
      var g = ING.BY[r.id];
      var gv = el('div.gv', { text: K.mass(S.batchG * r.pct / 100) });
      var over = r.pct > g.max * 1.001;
      body.appendChild(el('div.frow', null, [
        el('div.nm', { onclick: function () { showIng(g); } }, [
          el('b', { text: g.ko }),
          over ? el('small', null, [el('span.over', { text: '권장 상한 ' + g.max + '% 초과' })])
               : el('small', { text: g.inci })
        ]),
        stepper(r.pct, {
          kind: 'pct', unit: '%', min: 0, max: 100, fmt: pctText,
          onChange: function (v) {
            r.pct = v; S.result = null; S.spread = null;
            gv.textContent = K.mass(S.batchG * v / 100);
            refreshTotal(); scheduleResult();
          }
        }),
        gv,
        el('button.del', { text: '✕', 'aria-label': '삭제', onclick: function () {
          K.delRow(r.id); renderMid(); renderResult();
        } })
      ]));
    });
  });

  /* 카보머 중화 도우미 */
  if (S.rows.some(function (r) { return (r.id === 'carb940' || r.id === 'pemulen') && r.pct > 0; })) {
    var wrap = el('div', { style: 'padding:12px' });
    wrap.appendChild(el('h3.sec', { text: '중화 계산기 — pH 6.3 목표' }));
    var line = el('div.kv');
    ['arginine', 'tromet', 'tea', 'naoh'].forEach(function (a) {
      var need = CHEM.neutralizerNeeded(S.rows, a, 6.3);
      line.appendChild(el('button.chip', {
        text: ING.BY[a].ko + ' ' + need.toFixed(3) + '%',
        onclick: function () {
          var ex = S.rows.filter(function (r) { return r.id === a; })[0];
          if (ex) ex.pct = need; else S.rows.push({ id: a, pct: need });
          S.result = null; renderMid(); renderResult();
          K.toast(ING.BY[a].ko + ' ' + need.toFixed(3) + '% 적용');
        }
      }));
    });
    wrap.appendChild(line);
    body.appendChild(wrap);
  }

  var f = $('#midFoot');
  f.appendChild(el('div', { style: 'display:flex;gap:8px' }, [
    el('button.btn.pri', { style: 'flex:1', text: '＋ 원료 추가', onclick: function () { openPicker(); } }),
    el('button.btn', { text: '물로 맞추기', title: '정제수로 합계를 100% 로', onclick: function () {
      if (!K.balance()) { K.toast('다른 원료 합이 이미 100% 를 넘습니다'); return; }
      renderMid(); renderResult();
    } })
  ]));
  f.appendChild(el('div', { id: 'totline', style: 'margin-top:8px' }));
  refreshTotal();
}

function refreshTotal() {
  var n = $('#totline'); if (!n) return;
  clear(n);
  var t = K.total();
  var ok = Math.abs(t - 100) < 0.02;
  n.appendChild(el('div', { style: 'display:flex;align-items:center;gap:9px;font-size:13.5px' }, [
    el('span', { style: 'color:var(--ink-3)', text: '합계' }),
    el('b', { class: 'num', style: 'font-size:17px', text: t.toFixed(2) + '%' }),
    el('span', { style: 'color:var(--ink-3);font-size:12.5px',
      text: '· ' + S.rows.length + '종 · ' + K.mass(S.batchG) }),
    el('span.badge.' + (ok ? 'ok' : 'bad'), {
      style: 'margin:0 0 0 auto;padding:3px 10px',
      text: ok ? '정상' : t > 100 ? '초과 ' + (t - 100).toFixed(2) + '%' : '부족 ' + (100 - t).toFixed(2) + '%'
    })
  ]));
}

/* ── 공정 ──────────────────────────────────────────────────────── */
function materialize() {
  if (!S.steps) S.steps = K.steps().map(function (s) {
    return { t: s.t, ko: s.ko, temp: s.temp, aji: s.aji, homo: s.homo, min: s.min,
             vac: s.vac, add: (s.add || []).slice(), note: s.note };
  });
  return S.steps;
}

function renderProcess(body) {
  var rig = K.rig();
  $('#midTools').appendChild(el('button.btn.sm', {
    text: '표준 공정', title: '처방에 맞는 표준 제조 순서를 다시 짠다',
    onclick: function () { S.steps = null; S.result = null; renderMid(); K.toast('표준 공정으로 되돌렸습니다'); }
  }));

  var st = K.steps();
  body.appendChild(el('div', { style: 'padding:12px;background:var(--panel-2);border-bottom:1px solid var(--line)' }, [
    el('div', { style: 'font-size:15px;font-weight:600', text: rig.icon + ' ' + rig.ko + ' · ' + K.mass(S.batchG) }),
    el('div', { style: 'font-size:13px;color:var(--ink-2);margin-top:4px', text: rig.n }),
    el('div.kv', { style: 'margin-top:8px' }, [
      el('span', { text: '호모 Ø' + (rig.dHomo * 1000) + 'mm / 최대 ' + K.n0(rig.maxHomo) + 'rpm' }),
      el('span', { text: '아지 Ø' + (rig.dAji * 1000) + 'mm' }),
      el('span', { text: rig.vacuum ? '진공 가능' : '개방 · 진공 없음' })
    ])
  ]));

  st.forEach(function (s, i) {
    var node = el('div.step');
    node.appendChild(el('div.step-hd', null, [
      el('div.no', { text: i + 1 }),
      el('div.ttl', { text: s.ko || PROC.STEPKO[s.t] })
    ]));

    var par = el('div.step-par');
    function add(lab, key, kind, unit, max) {
      par.appendChild(el('span.parlab', { text: lab }));
      par.appendChild(stepper(s[key], {
        kind: kind, unit: unit, min: 0, max: max, cls: 'sm',
        fmt: function (v) { return String(v); },
        onChange: function (v) {
          materialize()[i][key] = v; S.result = null; S.spread = null; renderResult();
        }
      }));
    }
    add('온도', 'temp', 'temp', '℃', 120);
    add('시간', 'min', 'min', '분', 300);
    if (s.aji > 0 || s.t !== 'weigh') add('아지', 'aji', 'rpm', 'rpm', rig.maxAji);
    if (['emulsify', 'homo', 'grind', 'neutralize'].indexOf(s.t) >= 0 || s.homo > 0)
      add('호모', 'homo', 'rpm', 'rpm', rig.maxHomo);
    par.appendChild(el('button.chip', {
      'aria-pressed': !!s.vac, text: s.vac ? '진공 ON' : '진공 OFF',
      onclick: function () {
        if (!rig.vacuum) { K.toast('이 설비에는 진공이 없습니다'); return; }
        materialize()[i].vac = !s.vac; S.result = null; renderMid(); renderResult();
      }
    }));
    node.appendChild(par);

    if (s.homo > 0) {
      var tip = PROC.tipSpeed(rig.dHomo, s.homo);
      node.appendChild(el('div.step-add', null, [
        el('span.tag', {
          style: tip > 18 ? 'background:var(--bad-soft);color:var(--bad)'
               : tip < 3  ? 'background:var(--warn-soft);color:var(--warn)' : '',
          text: '팁속도 ' + tip.toFixed(1) + ' m/s' })
      ]));
    }
    if (s.add && s.add.length) {
      var tags = el('div.step-add');
      s.add.forEach(function (id) {
        var g = ING.BY[id]; if (!g) return;
        var hot = g.tmax && s.temp > g.tmax;
        tags.appendChild(el('span.tag', {
          style: hot ? 'background:var(--bad-soft);color:var(--bad);font-weight:600' : '',
          text: g.ko + (hot ? ' ⚠' + g.tmax + '℃' : '')
        }));
      });
      node.appendChild(tags);
    }
    if (s.note) node.appendChild(el('div.step-note', { text: s.note }));
    body.appendChild(node);
  });

  $('#midFoot').appendChild(el('div', { style: 'display:flex;align-items:center;gap:9px;font-size:13.5px' }, [
    el('span', { style: 'color:var(--ink-3)', text: '스텝' }),
    el('b', { class: 'num', style: 'font-size:17px', text: String(st.length) }),
    el('span', { style: 'color:var(--ink-3);font-size:12.5px',
      text: '· 지시 시간 ' + Math.round(st.reduce(function (a, b) { return a + b.min; }, 0)) + '분' }),
    el('span.badge.info', { style: 'margin:0 0 0 auto;padding:3px 10px', text: S.steps ? '수정됨' : '표준' })
  ]));
}

/* =====================================================================
   결과
   ===================================================================== */
function jarSvg(hex, ntu, eta, fill) {
  var alpha = 0.16 + 0.84 * Math.min(1, Math.pow(Math.max(ntu, 0.5) / 700, 0.55));
  var lvl = 92 - Math.max(22, Math.min(74, (fill == null ? 74 : fill) * 0.72));
  var dome = Math.min(8, 1.4 + Math.log(Math.max(eta, 1)) / Math.LN10 * 1.4);
  var id = 'j' + Math.floor(Math.random() * 1e6);
  var d = document.createElement('div');
  d.innerHTML =
  '<svg width="82" height="98" viewBox="0 0 82 98" aria-hidden="true" style="flex:0 0 auto">' +
  '<defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="1" y2="0">' +
  '<stop offset="0" stop-color="#000" stop-opacity=".14"/><stop offset=".28" stop-color="#fff" stop-opacity=".32"/>' +
  '<stop offset=".62" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".17"/>' +
  '</linearGradient>' +
  '<clipPath id="c' + id + '"><path d="M13 9 h56 v66 a12 12 0 0 1 -12 12 h-32 a12 12 0 0 1 -12 -12 z"/></clipPath></defs>' +
  '<path d="M13 9 h56 v66 a12 12 0 0 1 -12 12 h-32 a12 12 0 0 1 -12 -12 z" fill="var(--panel-3)"/>' +
  '<g clip-path="url(#c' + id + ')">' +
  '<rect x="13" y="' + lvl + '" width="56" height="98" fill="' + hex + '" opacity="' + alpha.toFixed(3) + '"/>' +
  '<ellipse cx="41" cy="' + lvl + '" rx="28" ry="' + dome.toFixed(1) + '" fill="' + hex + '" opacity="' + (alpha * 0.85).toFixed(3) + '"/>' +
  '<ellipse cx="41" cy="' + lvl + '" rx="28" ry="' + dome.toFixed(1) + '" fill="#fff" opacity=".2"/>' +
  '<rect x="13" y="0" width="56" height="98" fill="url(#g' + id + ')"/></g>' +
  '<path d="M13 9 h56 v66 a12 12 0 0 1 -12 12 h-32 a12 12 0 0 1 -12 -12 z" fill="none" stroke="var(--line-2)" stroke-width="1.5"/>' +
  '<rect x="10" y="3" width="62" height="7" rx="3" fill="var(--panel-3)" stroke="var(--line-2)" stroke-width="1.3"/>' +
  '</svg>';
  return d.firstChild;
}

function gauge(v, lo, hi, log) {
  var f = log ? function (x) { return Math.log(Math.max(x, 0.4)); } : function (x) { return x; };
  var pad = (f(hi) - f(lo)) * 1.15 + 0.001;
  var a = f(lo) - pad, b = f(hi) + pad;
  var pc = function (x) { return Math.max(0, Math.min(100, (f(x) - a) / (b - a) * 100)); };
  return el('div.gauge', null, [
    el('div.band', { style: 'left:' + pc(lo) + '%;right:' + (100 - pc(hi)) + '%' }),
    el('div.mark', { style: 'left:calc(' + pc(v) + '% - 1.5px)' })
  ]);
}

function met(k, v, u, cls, extra, rangeText) {
  return el('div.met' + (cls ? '.' + cls : ''), null, [
    el('div.k', { text: k }),
    el('div.v', null, [String(v), u ? el('span.u', { text: u }) : null]),
    rangeText ? el('div.r', { text: rangeText }) : null,
    extra || null
  ]);
}

function acc(title, count, countCls, open, buildBody) {
  var d = el('details.acc', open ? { open: true } : null);
  var sum = el('summary', null, [title]);
  if (count != null) sum.appendChild(el('span.cnt' + (countCls ? '.' + countCls : ''), { text: String(count) }));
  d.appendChild(sum);
  var b = el('div.body');
  d.appendChild(b);
  var built = false;
  function fill() { if (built) return; built = true; buildBody(b); }
  if (open) fill(); else d.addEventListener('toggle', function () { if (d.open) fill(); });
  return d;
}

function noteNode(i) {
  return el('div.note.s' + (i.sev >= 14 ? 3 : i.sev >= 7 ? 2 : 1), null, [
    el('div.sv', { text: '−' + i.sev }),
    el('div', null, [el('b', { text: i.ko }), i.msg])
  ]);
}

function renderResult() {
  var body = clear($('#resBody'));
  $('#resSub').textContent = '';

  if (!S.rows.filter(function (r) { return r.pct > 0; }).length) {
    body.appendChild(el('div.empty', { html: '처방을 만들고 <b>제조</b> 를 누르세요.' }));
    return;
  }

  var run = S.result;
  var r = run ? run.res : CHEM.evaluate(S.rows, { tip: 6.3, sec: 300 });
  var p = PROD.get(S.prod);
  var judge = PROD.judge(S.prod, r);
  var wrap = el('div.res');
  $('#resSub').textContent = run ? '실측' : '미리보기';

  /* ── 한눈에 ── */
  var st = r.stability;
  var verdict = judge.ok
    ? (st.score >= 85 ? '규격 통과 · 안정' : st.score >= 62 ? '규격 통과 · 불안 요소 있음' : '규격은 맞지만 불안정')
    : '규격 미달';
  wrap.appendChild(el('div.hero', null, [
    jarSvg(r.color.hex, r.ntu, r.eta, run ? run.yieldPct : 74),
    el('div.info', null, [
      el('div.verdict', {
        style: 'color:' + (judge.ok && st.score >= 62 ? 'var(--ok)' : judge.ok ? 'var(--warn)' : 'var(--bad)'),
        text: verdict }),
      el('div.sub', { text: p.icon + ' ' + p.ko + ' · ' + r.turb.grade + ' · ' + r.color.hex }),
      el('div', null, [
        el('span.badge.' + (judge.ok ? 'ok' : 'bad'), { text: judge.ok ? '규격 ✓' : '규격 ✗' }),
        ' ',
        el('span.badge.info', { text: '안정도 ' + st.score + ' (' + st.grade + ')' })
      ])
    ])
  ]));

  /* ── 과제 채점 ── */
  if (S.mission && run) wrap.appendChild(missionCard(run));

  /* ── 핵심 수치 ── */
  var mets = el('div.mets');
  var sv = p.spec.visc, sp = p.spec.ph, sn = p.spec.ntu;
  mets.appendChild(met('점도', K.eng(r.eta), 'cP',
    sv ? (r.eta >= sv[0] && r.eta <= sv[1] ? 'ok' : 'bad') : '',
    sv ? gauge(r.eta, sv[0], sv[1], true) : null,
    sv ? K.n0(sv[0]) + ' ~ ' + K.n0(sv[1]) : null));
  mets.appendChild(met('pH', r.pH.toFixed(2), '',
    sp ? (r.pH >= sp[0] && r.pH <= sp[1] ? 'ok' : 'bad') : '',
    sp ? gauge(r.pH, sp[0], sp[1]) : null,
    sp ? sp[0].toFixed(1) + ' ~ ' + sp[1].toFixed(1) : null));
  mets.appendChild(met('탁도', K.eng(r.ntu), 'NTU',
    sn ? (r.ntu >= sn[0] && r.ntu <= sn[1] ? 'ok' : 'bad') : '',
    sn ? gauge(r.ntu, Math.max(sn[0], 0.5), Math.min(sn[1], 1e5), true) : null,
    sn ? (sn[1] >= 1e6 ? K.n0(sn[0]) + ' 이상' : K.n0(sn[1]) + ' 이하') : null));
  mets.appendChild(met('원가', K.won(r.cost), '원/kg'));
  if (run) {
    mets.appendChild(met('수율', run.yieldPct.toFixed(1), '%',
      run.yieldPct >= 95 ? 'ok' : run.yieldPct < 85 ? 'bad' : ''));
    mets.appendChild(met('제조 시간', Math.round(run.minutes), '분'));
  }
  wrap.appendChild(mets);

  /* ── 문제 ── */
  var probs = st.items.slice();
  if (run) run.warn.forEach(function (w) {
    if (!probs.some(function (x) { return x.ko === w.ko && x.msg === w.msg; })) probs.push(w);
  });
  probs.sort(function (a, b) { return b.sev - a.sev; });

  wrap.appendChild(acc(probs.length ? '무엇이 문제인가' : '문제 없음',
    probs.length, probs.length ? (probs[0].sev >= 14 ? 'bad' : '') : 'ok',
    probs.length > 0, function (b) {
      if (!probs.length) {
        b.appendChild(el('div.note.good', null, [el('div', null, [
          el('b', { text: '지적 사항 없음' }), '처방과 공정 모두 문제가 발견되지 않았습니다.'])]));
        return;
      }
      probs.forEach(function (i) { b.appendChild(noteNode(i)); });
    }));

  /* ── 규격 ── */
  if (judge.items.length) wrap.appendChild(acc('출하 규격', judge.items.filter(function (i) { return i.ok; }).length + '/' + judge.items.length,
    judge.ok ? 'ok' : 'bad', false, function (b) {
      judge.items.forEach(function (i) {
        b.appendChild(el('div.goal' + (i.ok ? '.hit' : ''), null, [
          el('div.bx', { text: '✓' }),
          el('div.gt', { text: i.ko + ' ' + (i.range[1] >= 1e6
            ? fnum(i.range[0], i.fmt) + ' 이상'
            : fnum(i.range[0], i.fmt) + ' ~ ' + fnum(i.range[1], i.fmt)) + (i.unit ? ' ' + i.unit : '') }),
          el('div.gv', { text: i.fmt ? i.val.toFixed(i.fmt) : K.n0(i.val) })
        ]));
      });
    }));

  /* ── 자세히 ── */
  wrap.appendChild(acc('점도와 유화 자세히', null, null, false, function (b) {
    var v = r.visc, kv = el('div.kv');
    if (v.gel > 1) kv.appendChild(el('span', { text: '점증제 겔 ' + K.eng(v.gel) + ' cP' }));
    if (v.lam > 1) kv.appendChild(el('span', { text: '라멜라 겔망 ' + K.eng(v.lam) + ' cP' }));
    if (v.surfV > 1) kv.appendChild(el('span', { text: '미셀 ' + K.eng(v.surfV) + ' cP' }));
    kv.appendChild(el('span', { text: '내상 효과 ×' + v.KD.toFixed(2) }));
    kv.appendChild(el('span', { text: '전단감점 n ' + r.nIdx.toFixed(2) }));
    if (v.yieldStress > 0.1) kv.appendChild(el('span', { text: '항복응력 ' + v.yieldStress.toFixed(1) + ' Pa' }));
    b.appendChild(kv);
    var d = r.drop;
    if (d && !d.minor) {
      b.appendChild(el('h3.sec', { text: '유화' }));
      b.appendChild(el('div.kv', null, [
        el('span', { text: '평균 액적 ' + r.d32.toFixed(2) + ' µm' }),
        el('span', { text: '오일 요구 HLB ' + d.rh.toFixed(1) }),
        el('span', { text: '유화제 HLB ' + d.bh.toFixed(1) }),
        el('span', { text: '계면장력 ' + d.sigma.toFixed(1) + ' mN/m' }),
        el('span', { text: '전단 한계 ' + d.dShear.toFixed(2) + ' µm' }),
        el('span', { text: '피복 한계 ' + (d.dCover > 100 ? '—' : d.dCover.toFixed(2) + ' µm') }),
        el('span', { text: '내상 ' + (r.agg.phi * 100).toFixed(1) + '%' }),
        el('span', { text: '굴절률 차 ' + r.agg.dn.toFixed(3) }),
        el('span', { text: '크리밍 ' + (r.cream ? r.cream.toFixed(2) + ' mm/일' : '정지') })
      ]));
    }
  }));

  if (run) {
    wrap.appendChild(acc('스케일이 만든 차이', null, null, false, function (b) {
      var t = el('table.rec');
      t.appendChild(el('thead', null, [el('tr', null, [
        el('th', { text: '항목' }), el('th', { text: '이론' }), el('th', { text: '실측' }), el('th', { text: '차이' })])]));
      var tb = el('tbody');
      function cr(ko, a, c, fmt) {
        var dv = a ? (c - a) / a * 100 : 0;
        tb.appendChild(el('tr', null, [
          el('td', { text: ko }), el('td', { text: fmt(a) }), el('td', { text: fmt(c) }),
          el('td', { class: Math.abs(dv) > 12 ? 'hi' : '', text: (dv >= 0 ? '+' : '') + dv.toFixed(1) + '%' })]));
      }
      cr('점도 cP', run.ideal.eta, run.res.eta, K.eng);
      cr('pH', run.ideal.pH, run.res.pH, function (x) { return x.toFixed(2); });
      cr('탁도 NTU', run.ideal.ntu, run.res.ntu, K.eng);
      t.appendChild(tb);
      b.appendChild(el('div.scroller', null, [t]));
      b.appendChild(el('h3.sec', { text: '이 배치의 조건' }));
      b.appendChild(el('div.kv', null,
        [['설비', run.rig.icon + ' ' + run.rig.ko],
         ['용기 지름', (run.geo.D * 100).toFixed(1) + ' cm'],
         ['표면적/부피', run.geo.svRatio.toFixed(1) + ' /m'],
         ['증발 손실', run.evapPct.toFixed(2) + '%'],
         ['벽면 잔류', K.mass(run.holdG)],
         ['최고 온도', run.maxT.toFixed(0) + '℃'],
         ['열이력', run.thermalDose.toFixed(0)],
         ['냉각 속도', run.coolRate.toFixed(2) + ' ℃/분'],
         ['라멜라 계수', '×' + run.coolFactor.toFixed(2)],
         ['혼합 균질도', run.homog.toFixed(0) + '%'],
         ['95% 혼합', (run.theta / 60).toFixed(1) + '분'],
         ['혼입 기포', run.airPct.toFixed(2) + '%']
        ].map(function (x) { return el('span', { text: x[0] + ' ' + x[1] }); })));
    }));

    wrap.appendChild(acc('공정 타임라인', Math.round(run.minutes) + '분', null, false, function (b) {
      var tmax = Math.max(run.minutes, 1), acc2 = 0;
      run.trace.forEach(function (t) {
        var w = t.min / tmax * 100, x = acc2 / tmax * 100; acc2 += t.min;
        var hot = Math.max(0, Math.min(1, (t.temp - 25) / 65));
        b.appendChild(el('div.tlrow', null, [
          el('div.tt', { text: t.min >= 1 ? Math.round(t.min) + '분' : '<1분' }),
          el('div.tlbar', null, [el('i', { style: 'left:' + x + '%;width:' + Math.max(w, 1.5) +
            '%;background:hsl(' + Math.round(210 - hot * 205) + ' 62% ' + (52 - hot * 6) + '%)' })]),
          el('div.tn', { text: t.ko })
        ]));
      });
      b.appendChild(el('div', { style: 'font-size:12px;color:var(--ink-3);margin-top:6px',
        text: '막대 색 = 그 스텝의 도달 온도 (파랑 25℃ → 빨강 90℃)' }));
    }));

    wrap.appendChild(acc('칭량 기록', run.items.length + '종', null, false, function (b) {
      var t = el('table.rec');
      t.appendChild(el('thead', null, [el('tr', null, [
        el('th', { text: '원료' }), el('th', { text: '%' }), el('th', { text: '목표' }),
        el('th', { text: '실제' }), el('th', { text: '오차' }), el('th', { text: '저울' })])]));
      var tb = el('tbody');
      run.items.slice().sort(function (a, c) { return Math.abs(c.rel) - Math.abs(a.rel); }).forEach(function (i) {
        tb.appendChild(el('tr', null, [
          el('td', { text: i.g.ko }), el('td', { text: i.pct.toFixed(3) }),
          el('td', { text: K.mass(i.target) }), el('td', { text: K.mass(i.actual) }),
          el('td', { class: Math.abs(i.rel) > 0.05 ? 'hi' : '', text: (i.rel * 100).toFixed(2) + '%' }),
          el('td', { text: i.scale.d + ' g' })]));
      });
      t.appendChild(tb);
      b.appendChild(el('div.scroller', null, [t]));
    }));
  }

  if (S.spread) {
    var sp2 = S.spread;
    wrap.appendChild(acc('배치 간 편차 (5배치)', null, null, true, function (b) {
      var t = el('table.rec');
      t.appendChild(el('thead', null, [el('tr', null, [
        el('th', { text: '항목' }), el('th', { text: '평균' }), el('th', { text: '최소' }),
        el('th', { text: '최대' }), el('th', { text: 'CV' })])]));
      var tb = el('tbody');
      function sr(ko, s2, f) {
        tb.appendChild(el('tr', null, [
          el('td', { text: ko }), el('td', { text: f(s2.mean) }), el('td', { text: f(s2.min) }),
          el('td', { text: f(s2.max) }), el('td', { class: s2.cv > 5 ? 'hi' : '', text: s2.cv.toFixed(2) + '%' })]));
      }
      sr('점도 cP', sp2.eta, K.eng);
      sr('pH', sp2.pH, function (x) { return x.toFixed(2); });
      sr('탁도 NTU', sp2.ntu, K.eng);
      sr('수율 %', sp2.yieldPct, function (x) { return x.toFixed(1); });
      if (sp2.d32.mean > 0) sr('액적 µm', sp2.d32, function (x) { return x.toFixed(2); });
      t.appendChild(tb);
      b.appendChild(el('div.scroller', null, [t]));
    }));
  }

  body.appendChild(wrap);
}

function fnum(v, d) { return d ? v.toFixed(d) : K.n0(v); }

/* 드래그 중에는 프레임당 한 번만 다시 계산한다 */
var resPend = 0;
function scheduleResult() {
  if (resPend) return;
  resPend = requestAnimationFrame(function () { resPend = 0; renderResult(); });
}

/* =====================================================================
   학습
   ===================================================================== */
var TYPEKO = { build: '설계', fix: '고장 수리', process: '공정 개선', scale: '스케일업' };
function gradeColor(g) {
  return g === 'S' ? 'var(--acc)' : g === 'A' ? 'var(--ok)' : g === 'B' ? 'var(--info)' : 'var(--warn)';
}

function renderLearn(body) {
  var tot = MISS.LIST.length;
  var done = MISS.LIST.filter(function (m) { return S.progress[m.id]; }).length;
  $('#midTools').appendChild(el('span.badge.info', { style: 'padding:5px 11px', text: done + ' / ' + tot }));

  body.appendChild(el('div', { style: 'padding:12px;background:var(--panel-2);border-bottom:1px solid var(--line)' }, [
    el('div', { style: 'font-size:15px;font-weight:600', text: '17개 제품군 · ' + tot + '개 과제' }),
    el('div', { style: 'font-size:13.5px;color:var(--ink-2);margin-top:4px',
      text: '과제를 고르면 시작 처방과 조건이 세팅됩니다. 제조할 때마다 채점되고, 필수 조건을 다 채우면 통과입니다.' })
  ]));

  MISS.CHAPTERS.forEach(function (ch, ci) {
    var d = ch.list.filter(function (m) { return S.progress[m.id]; }).length;
    var open = S.openCh === ch.key;
    var sec = el('div.chapter');
    sec.appendChild(el('button.ch-hd', {
      onclick: function () { S.openCh = open ? null : ch.key; renderMid(); }
    }, [
      el('div.ic', { text: ch.icon }),
      el('div.t', null, [
        el('b', { text: (ci + 1) + '. ' + ch.ko }),
        el('small', { text: ch.tag }),
        el('div.prog', null, [el('i', { style: 'width:' + (ch.list.length ? d / ch.list.length * 100 : 0) + '%' })])
      ]),
      el('div.pg', { text: d + '/' + ch.list.length })
    ]));
    if (open) {
      sec.appendChild(el('div', { style: 'padding:12px;background:var(--panel-2);border-top:1px solid var(--line)' }, [
        el('div', { style: 'font-size:13.5px;color:var(--ink-2);line-height:1.7', text: ch.n }),
        el('div.kv', { style: 'margin-top:8px' }, ch.key3.map(function (t) {
          return el('span', { style: 'font-family:var(--sans)', text: '· ' + t }); }))
      ]));
      ch.list.forEach(function (m) {
        var pr = S.progress[m.id];
        sec.appendChild(el('button.mrow', { onclick: function () { openMission(m); } }, [
          el('div.st' + (pr ? '.done' : ''), { text: pr ? '✓' : String(m.no) }),
          el('div.tx', null, [
            el('b', { text: m.ko }),
            el('small', { text: TYPEKO[m.type] + ' · 필수 ' + m.must.length + '개' +
              (m.batchG ? ' · ' + K.mass(m.batchG) : '') })
          ]),
          el('div.gr', { style: 'color:' + (pr ? gradeColor(pr.grade) : 'var(--ink-3)'), text: pr ? pr.grade : '' })
        ]));
      });
    }
    body.appendChild(sec);
  });
}

function openMission(m) {
  var goals = el('div');
  goals.appendChild(el('h3.sec', { text: '필수 조건' }));
  m.must.forEach(function (c) {
    goals.appendChild(el('div.goal', null, [el('div.bx', { text: '✓' }), el('div.gt', { text: MISS.label(c, m.ch) })]));
  });
  if (m.bonus.length) {
    goals.appendChild(el('h3.sec', { text: '추가 조건 — 만점용' }));
    m.bonus.forEach(function (c) {
      goals.appendChild(el('div.goal.opt', null, [el('div.bx', { text: '✓' }), el('div.gt', { text: MISS.label(c, m.ch) })]));
    });
  }
  var sh = K.sheet(m.ko, el('div', null, [
    el('div.rt', null, [
      el('p', { html: '<b>' + TYPEKO[m.type] + '</b> · ' + PROD.get(m.ch).ko +
        (m.batchG ? ' · 배치 ' + K.mass(m.batchG) : '') }),
      el('p', { text: m.brief }),
      m.hint ? el('p', { style: 'color:var(--ink-3);font-size:13.5px', text: '힌트 — ' + m.hint }) : null
    ]),
    goals
  ]), [
    el('button.btn', { text: '닫기', onclick: function () { sh.close(); } }),
    el('button.btn.pri', { style: 'flex:1', text: '이 과제 시작', onclick: function () { startMission(m); sh.close(); } })
  ]);
}

function startMission(m) {
  S.mission = m;
  S.prod = m.ch;
  K.setRows(MISS.startRows(m));
  if (m.batchG) S.batchG = m.batchG;
  S.rigKey = m.rigKey || null;
  S.steps = null; S.result = null; S.spread = null;
  if (m.pm && m.pm.length) {
    var st = materialize();
    m.pm.forEach(function (mu) {
      st.forEach(function (x, i) {
        if (mu.t ? x.t === mu.t : i === mu.i) for (var k in mu.set) x[k] = mu.set[k];
      });
    });
  }
  S.mid = 'form'; S.view = 'form';
  syncTop(); renderAll(); go('form');
  K.toast('과제 시작 — ' + m.ko);
}

function missionCard(run) {
  var m = S.mission;
  var g = MISS.grade(m, run, S);
  var box = el('div', { style: 'margin-bottom:12px' });
  box.appendChild(el('div.note.' + (g.ok ? 'good' : 's2'), { style: 'margin-bottom:8px' }, [
    el('div', null, [
      el('b', { text: (g.ok ? '통과 · ' + g.grade + ' 등급 ' + g.score + '점' : '아직 미달') + '  —  ' + m.ko }),
      g.ok ? ('추가 조건 ' + g.bHit + '/' + m.bonus.length + ' 달성.')
           : ('필수 ' + g.must.filter(function (x) { return x.ok; }).length + '/' + g.must.length + ' 충족.')
    ])
  ]));
  var det = acc('과제 조건', g.must.filter(function (x) { return x.ok; }).length + '/' + g.must.length,
    g.ok ? 'ok' : 'bad', !g.ok, function (b) {
      g.must.forEach(function (x) {
        b.appendChild(el('div.goal' + (x.ok ? '.hit' : ''), null, [
          el('div.bx', { text: '✓' }), el('div.gt', { text: x.t }), el('div.gv', { text: x.v })]));
      });
      if (g.bonus.length) {
        b.appendChild(el('h3.sec', { text: '추가 조건' }));
        g.bonus.forEach(function (x) {
          b.appendChild(el('div.goal.opt' + (x.ok ? '.hit' : ''), null, [
            el('div.bx', { text: '✓' }), el('div.gt', { text: x.t }), el('div.gv', { text: x.v })]));
        });
      }
      b.appendChild(el('div', { style: 'display:flex;gap:7px;margin-top:12px;flex-wrap:wrap' }, [
        el('button.btn.sm', { text: '설명 다시 보기', onclick: function () { openMission(m); } }),
        el('button.btn.sm', { text: '과제 그만두기', onclick: function () {
          S.mission = null; renderAll(); K.toast('자유 모드로 돌아갔습니다'); } })
      ]));
    });
  det.style.marginTop = '0';
  box.appendChild(det);
  if (g.ok) {
    var prev = S.progress[m.id];
    if (!prev || prev.score < g.score) { S.progress[m.id] = { score: g.score, grade: g.grade }; persist(); }
  }
  return box;
}

/* =====================================================================
   실행 · 내비게이션
   ===================================================================== */
function runBatch(spread) {
  if (!S.rows.filter(function (r) { return r.pct > 0; }).length) { K.toast('처방이 비어 있습니다'); return; }
  var t = K.total();
  if (Math.abs(t - 100) > 0.02) K.toast('합계가 ' + t.toFixed(2) + '% 입니다 — 비율대로 환산해 제조합니다');
  var p = PROD.get(S.prod);
  var opt = { batchG: S.batchG, rig: K.rig(), steps: K.steps(), kind: p.kind, seed: S.seed };
  try {
    S.result = SIM.run(S.rows, opt);
    S.spread = spread ? SIM.repeat(S.rows, opt, 5) : null;
  } catch (e) {
    K.toast('계산 오류: ' + e.message);
    if (window.console) console.error(e);
    return;
  }
  go('res'); renderResult(); persist();
}

function syncNav() {
  K.$$('#nav button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.go === S.view); });
}

function go(v) {
  S.view = v;
  if (v === 'form' || v === 'proc' || v === 'learn') S.mid = v;
  var map = { form: 'p-mid', proc: 'p-mid', learn: 'p-mid', res: 'p-res' };
  K.$$('.pane').forEach(function (n) { n.classList.toggle('active', n.id === map[v]); });
  syncNav();
  renderMid();
}

function syncTop() {

function dumpJson() {
  var o = { v: 1, prod: S.prod, batchG: S.batchG, rigKey: S.rigKey, rows: S.rows, steps: S.steps };
  var blob = new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'formulab-' + S.prod + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
}

function loadJson() {
  var inp = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  document.body.appendChild(inp);
  inp.addEventListener('change', function () {
    var f = inp.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        if (o.prod) S.prod = o.prod;
        if (o.batchG) S.batchG = o.batchG;
        S.rigKey = o.rigKey || null;
        K.setRows(o.rows || []);
        S.steps = o.steps || null;
        UI.renderAll(); UI.persist(); K.toast('불러왔습니다');
      } catch (e) { K.toast('파일을 읽지 못했습니다'); }
      inp.remove();
    };
    fr.readAsText(f);
  });
  inp.click();
}

/* ── 초기화 ────────────────────────────────────────────────────── */
function boot() {
  try {
    var t = localStorage.getItem('formulab.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}

  fillProducts();

  var saved = K.load();
  if (saved.progress) S.progress = saved.progress;

  var fromHash = K.unpack((location.hash || '').replace(/^#/, ''));
  if (fromHash && fromHash.rows && fromHash.rows.length) {
    S.prod = fromHash.prod || S.prod;
    S.batchG = fromHash.batchG || S.batchG;
    K.setRows(fromHash.rows);
    S.steps = fromHash.steps;
    K.toast('공유된 처방을 불러왔습니다');
  } else if (saved.rows && saved.rows.length) {
    S.prod = saved.prod || S.prod;
    S.batchG = saved.batchG || S.batchG;
    S.rigKey = saved.rigKey || null;
    K.setRows(saved.rows);
    S.steps = saved.steps || null;
    if (saved.mission && MISS.ALL[saved.mission]) S.mission = MISS.ALL[saved.mission];
  } else {
    K.setRows(PROD.get(S.prod).base);
  }

  $('#selProd').addEventListener('change', function () {
    S.prod = $('#selProd').value;
    S.mission = null; S.result = null; S.spread = null; S.steps = null;
    UI.renderMid(); UI.renderResult(); UI.persist();
    K.toast(PROD.get(S.prod).ko + ' 규격으로 전환');
  });
  $('#btnBatch').addEventListener('click', openBatch);
  $('#btnRun').addEventListener('click', function () { UI.run(false); });
  $('#btnRepeat').addEventListener('click', function () { UI.run(true); });
  $('#btnMenu').addEventListener('click', openMenu);

  var q = $('#q');
  q.addEventListener('input', function () { S.q = q.value; UI.renderIngList(); });
  $('#qClear').addEventListener('click', function () { S.q = ''; q.value = ''; q.focus(); UI.renderIngList(); });
  $('#pickDone').addEventListener('click', UI.closePicker);
  $('#picker').addEventListener('click', function (e) { if (e.target.id === 'picker') UI.closePicker(); });

  K.$$('#nav button').forEach(function (b) {
    b.addEventListener('click', function () { UI.go(b.dataset.go); });
  });

  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); UI.run(false); }
    if (e.key === 'Escape' && !$('#picker').hidden) { e.preventDefault(); UI.closePicker(); }
    if (e.key === '/' && !typing) { e.preventDefault(); UI.openPicker(); }
  });

  window.addEventListener('beforeunload', function () {
    try { history.replaceState(null, '', '#' + K.pack(S)); } catch (e) {}
  });

  UI.go('form');
  UI.renderAll();
}

        '부팅 오류\n' + (e && e.stack || e) + '</pre>');

  }

})();
