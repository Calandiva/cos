<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="화장품 제조 시뮬레이터. 원료를 골라 처방을 짜고 공정을 돌려 점도·pH·탁도·색상과 배치 규모별 오차까지 계산한다.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#A8436B">
<meta charset="utf-8">
<title>포뮬라랩 — 화장품 제조 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F3F6; --panel:#FFFFFF; --panel-2:#F6F8FA; --panel-3:#EAEEF3;
  --line:#DCE2E9; --line-2:#C2CCD6;
  --ink:#141E28; --ink-2:#4A5A6A; --ink-3:#8090A0;
  --acc:#A8436B; --acc-soft:#FCE9F0; --acc-line:#E2A5BE; --acc-ink:#FFFFFF;
  --ok:#237A4B; --ok-soft:#DFF2E7;
  --warn:#A96E08; --warn-soft:#FAEDD2;
  --bad:#C0353A; --bad-soft:#FBE0E1;
  --info:#2F5AAE; --info-soft:#E1E9F8;
  --shadow:0 1px 2px rgba(18,30,42,.05),0 10px 30px rgba(18,30,42,.10);
  --shadow-sm:0 1px 3px rgba(18,30,42,.10);
  --r:12px; --r-sm:9px;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","D2Coding",ui-monospace,Consolas,monospace;
  --topH:58px; --navH:62px; --tap:44px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1116; --panel:#151C23; --panel-2:#1B232B; --panel-3:#242E38;
  --line:#2A343F; --line-2:#3B4854;
  --ink:#E6ECF2; --ink-2:#A6B4C1; --ink-3:#71818F;
  --acc:#E692AE; --acc-soft:#31171F; --acc-line:#71384C; --acc-ink:#1D1013;
  --ok:#54C486; --ok-soft:#102A1B;
  --warn:#E0AC4C; --warn-soft:#2E2411;
  --bad:#EE7176; --bad-soft:#301618;
  --info:#87A6F0; --info-soft:#161F34;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.45);
  --shadow-sm:0 1px 3px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#0C1116; --panel:#151C23; --panel-2:#1B232B; --panel-3:#242E38;
  --line:#2A343F; --line-2:#3B4854;
  --ink:#E6ECF2; --ink-2:#A6B4C1; --ink-3:#71818F;
  --acc:#E692AE; --acc-soft:#31171F; --acc-line:#71384C; --acc-ink:#1D1013;
  --ok:#54C486; --ok-soft:#102A1B;
  --warn:#E0AC4C; --warn-soft:#2E2411;
  --bad:#EE7176; --bad-soft:#301618;
  --info:#87A6F0; --info-soft:#161F34;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.45);
  --shadow-sm:0 1px 3px rgba(0,0,0,.55);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:7px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ══ 셸 ══════════════════════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100dvh;min-height:0}

#top{
  display:flex;align-items:center;gap:9px;padding:0 12px;min-height:var(--topH);
  background:var(--panel);border-bottom:1px solid var(--line);
  flex:0 0 auto;z-index:40;box-shadow:var(--shadow-sm);
}
.brand{font-weight:700;font-size:17px;letter-spacing:-.4px;flex:0 0 auto;user-select:none}
#top .grow{flex:1 1 auto;min-width:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap);padding:0 15px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:15px;font-weight:600;white-space:nowrap;transition:.12s;
}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:36px;padding:0 11px;font-size:13.5px;font-weight:500}
.btn.ico{padding:0;width:var(--tap);font-size:20px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

select{
  min-height:var(--tap);padding:0 30px 0 12px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:15px;font-weight:600;max-width:100%;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) calc(50% + 2px),calc(100% - 12px) calc(50% + 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
input[type=search],input[type=text]{
  min-height:var(--tap);padding:0 12px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm);font-size:16px;width:100%;
}

/* ══ 본문 ════════════════════════════════════════════════════════ */
#main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.pane{min-height:0;min-width:0;display:none;flex-direction:column;overflow:hidden;background:var(--panel)}
.pane.active{display:flex}
.pane-hd{
  display:flex;align-items:center;gap:8px;padding:9px 12px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:var(--panel);min-height:52px;
}
.pane-hd h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px}
.pane-bd{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pane-ft{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:10px 12px}

.seg{display:flex;gap:2px;background:var(--panel-3);padding:3px;border-radius:10px}
.seg button{
  padding:0 14px;min-height:34px;border-radius:8px;font-size:14px;font-weight:600;
  color:var(--ink-2);transition:.12s;
}
.seg button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ══ 하단 탭 ═════════════════════════════════════════════════════ */
#nav{
  display:flex;flex:0 0 auto;min-height:var(--navH);background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40;
}
#nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:11.5px;font-weight:600;padding:6px 0;
}
#nav button .g{font-size:20px;line-height:1}
#nav button[aria-selected=true]{color:var(--acc)}

/* ══ 처방표 ══════════════════════════════════════════════════════ */
.phase-hd{
  display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:var(--panel-3);border-bottom:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink-2);position:sticky;top:0;z-index:3;
}
.phase-hd .pdot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.phase-hd .amt{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--ink-3);font-size:12.5px}

.frow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.frow .nm{flex:1 1 auto;min-width:0;cursor:pointer}
.frow .nm b{display:block;font-size:15px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .nm small{font-size:12px;color:var(--ink-3);font-family:var(--mono);
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .nm .over{color:var(--warn);font-family:var(--sans);font-weight:600}
.frow .gv{font-family:var(--mono);font-size:12px;color:var(--ink-3);
  flex:0 0 auto;width:72px;text-align:right}
.frow .del{width:36px;height:36px;flex:0 0 auto;color:var(--ink-3);font-size:18px;border-radius:8px}
.frow .del:hover{background:var(--bad-soft);color:var(--bad)}

/* ══ 휠 스테퍼 ═══════════════════════════════════════════════════ */
.stp{
  display:inline-flex;align-items:stretch;flex:0 0 auto;
  border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
  overflow:hidden;user-select:none;
}
.stp button{
  width:38px;flex:0 0 auto;font-size:21px;font-weight:400;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.stp button:hover{background:var(--panel-3);color:var(--ink)}
.stp button:active{background:var(--acc-soft);color:var(--acc)}
.stp .v{
  min-width:80px;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:2px;
  background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
  cursor:ns-resize;position:relative;touch-action:none;
}
.stp .v b{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.3px}
.stp .v em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:500}
.stp .v input{
  width:100%;border:0;background:none;text-align:center;font-family:var(--mono);
  font-size:16px;font-weight:600;padding:0;min-height:0;height:100%;
}
.stp.drag .v{background:var(--acc-soft)}
.stp.lg{border-radius:12px}
.stp.lg button{width:54px;font-size:27px}
.stp.lg .v{min-width:124px}
.stp.lg .v b{font-size:25px}
.stp.sm button{width:32px;font-size:18px}
.stp.sm .v{min-width:64px}
.stp.sm .v b{font-size:14px}

/* ══ 원료 고르기 오버레이 ════════════════════════════════════════ */
.ovl{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;
  background:rgba(14,22,30,.45);backdrop-filter:blur(3px);animation:ovlin .18s ease}
@keyframes ovlin{from{opacity:0}to{opacity:1}}
.ovl .box{
  background:var(--panel);display:flex;flex-direction:column;flex:1 1 auto;min-height:0;
  box-shadow:var(--shadow);
}
.ovl .phd{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.ovl .phd b{font-size:17px;font-weight:700;flex:0 0 auto}
.srch{position:relative;flex:1 1 auto}
.srch input{padding-left:38px;padding-right:40px}
.srch .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);font-size:17px;pointer-events:none}
.srch .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:8px;color:var(--ink-3);font-size:16px}

.chips{display:flex;gap:7px;padding:9px 12px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);
  background:var(--panel-2);font-size:13.5px;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
}
.chip[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

.ilist{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.irow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line)}
.irow.on{background:var(--acc-soft)}
.irow .bar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto;min-height:40px}
.irow .txt{flex:1 1 auto;min-width:0;cursor:pointer}
.irow .n1{font-size:15px;font-weight:600;line-height:1.35}
.irow .n2{font-size:12px;color:var(--ink-3);font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .n3{font-size:12.5px;color:var(--ink-2);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.irow .act{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.irow .addb{
  min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--acc-line);
  background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:13.5px;white-space:nowrap;
}
.irow .addb:hover{background:var(--acc);color:var(--acc-ink)}
.irow .info{width:34px;height:34px;border-radius:8px;color:var(--ink-3);font-size:16px;flex:0 0 auto}
.irow .info:hover{background:var(--panel-3);color:var(--ink)}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:15px;line-height:1.9}

/* ══ 공정 ════════════════════════════════════════════════════════ */
.step{border-bottom:1px solid var(--line);padding:11px 12px}
.step-hd{display:flex;align-items:center;gap:10px}
.step-hd .no{
  width:28px;height:28px;border-radius:50%;background:var(--panel-3);color:var(--ink-2);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;font-family:var(--mono);
}
.step-hd .ttl{flex:1 1 auto;font-size:15px;font-weight:600;min-width:0}
.step-par{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
.parlab{font-size:12px;color:var(--ink-3);font-weight:600}
.step-add{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--panel-3);
  color:var(--ink-2);font-weight:500}
.step-note{margin-top:9px;font-size:13px;color:var(--ink-2);line-height:1.65;
  border-left:3px solid var(--line-2);padding-left:10px}

/* ══ 결과 ════════════════════════════════════════════════════════ */
.res{padding:12px}
.hero{
  display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:12px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
}
.hero .info{flex:1 1 auto;min-width:0}
.hero .verdict{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.5px}
.hero .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.hero .badge{display:inline-flex;align-items:center;gap:5px;margin-top:9px;
  padding:5px 12px;border-radius:14px;font-size:12.5px;font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}

.mets{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.met{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.met .k{font-size:12px;color:var(--ink-3);font-weight:600}
.met .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.6px}
.met .u{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:3px}
.met .r{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-top:1px}
.met.ok{border-color:var(--ok);background:var(--ok-soft)}
.met.bad{border-color:var(--bad);background:var(--bad-soft)}
.gauge{height:6px;border-radius:3px;background:var(--panel-3);margin-top:7px;position:relative;overflow:hidden}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.3}
.gauge .mark{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;background:var(--ink)}

.acc{border:1px solid var(--line);border-radius:var(--r-sm);margin-top:10px;overflow:hidden;background:var(--panel)}
.acc>summary{
  list-style:none;padding:12px 14px;display:flex;align-items:center;gap:9px;cursor:pointer;
  font-size:14.5px;font-weight:600;background:var(--panel-2);
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'⌄';margin-left:auto;color:var(--ink-3);font-size:17px;transition:.15s}
.acc[open]>summary::after{transform:rotate(180deg)}
.acc>summary .cnt{font-size:12px;font-weight:700;padding:2px 9px;border-radius:11px;
  background:var(--panel-3);color:var(--ink-2)}
.acc>summary .cnt.bad{background:var(--bad-soft);color:var(--bad)}
.acc>summary .cnt.ok{background:var(--ok-soft);color:var(--ok)}
.acc .body{padding:12px 14px;border-top:1px solid var(--line)}

.note{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-sm);margin-bottom:8px;
  font-size:13.5px;line-height:1.65;border:1px solid transparent}
.note:last-child{margin-bottom:0}
.note .sv{font-family:var(--mono);font-size:12px;font-weight:700;flex:0 0 auto;padding-top:1px;min-width:26px}
.note b{display:block;font-size:13.5px;margin-bottom:2px}
.note.s3{background:var(--bad-soft);border-color:var(--bad)}
.note.s2{background:var(--warn-soft);border-color:var(--warn)}
.note.s1{background:var(--info-soft);border-color:var(--info)}
.note.good{background:var(--ok-soft);border-color:var(--ok)}

.kv{display:flex;flex-wrap:wrap;gap:7px}
.kv span{font-size:12.5px;font-family:var(--mono);color:var(--ink-2);
  background:var(--panel-2);border:1px solid var(--line);padding:4px 9px;border-radius:7px}

table.rec{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
table.rec th{text-align:right;font-weight:700;color:var(--ink-3);padding:6px 7px;
  border-bottom:1px solid var(--line-2);font-size:11.5px}
table.rec th:first-child{text-align:left}
table.rec td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.rec td:first-child{text-align:left;font-family:var(--sans);white-space:normal}
table.rec td.hi{color:var(--bad);font-weight:700}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

.tlrow{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:4px 0}
.tlrow .tt{width:52px;flex:0 0 auto;font-family:var(--mono);color:var(--ink-3);text-align:right}
.tlbar{flex:1 1 auto;height:18px;border-radius:4px;background:var(--panel-3);position:relative;overflow:hidden}
.tlbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.tlrow .tn{width:104px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}

/* ══ 학습 ════════════════════════════════════════════════════════ */
.chapter{border-bottom:1px solid var(--line)}
.ch-hd{display:flex;align-items:center;gap:12px;padding:14px 12px;width:100%;text-align:left}
.ch-hd .ic{font-size:24px;flex:0 0 auto;line-height:1}
.ch-hd .t{flex:1 1 auto;min-width:0}
.ch-hd .t b{display:block;font-size:15.5px;font-weight:700}
.ch-hd .t small{font-size:12.5px;color:var(--ink-3)}
.ch-hd .pg{font-family:var(--mono);font-size:13px;color:var(--ink-3);flex:0 0 auto;font-weight:600}
.prog{height:4px;background:var(--panel-3);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:2px}
.mrow{display:flex;align-items:center;gap:11px;padding:12px 12px 12px 40px;
  border-top:1px solid var(--line);background:var(--panel-2);width:100%;text-align:left}
.mrow .st{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;
  background:var(--panel-3);color:var(--ink-3);font-family:var(--mono)}

<body>
<div id="app">

  <header id="top">
    <div class="brand">포뮬라랩</div>

<script>
/* =====================================================================
   포뮬라랩 — 원료 데이터베이스
   ---------------------------------------------------------------------
   필드 (생략하면 NORM 의 기본값)
     id    코드            ko/inci  한글명 / INCI
     cat   분류 키          ph  기본 투입 상 (A수상 B유상 C냉각 D중화 E예비분산)
     sol   용해성 w수용 o유용 d분산 wo양쪽
     u     [최소,최대,권장] 사용률 %
     d     밀도 g/mL       ri  굴절률
     hlb   유화제 HLB      rh  오일이 요구하는 HLB(required HLB)
     th    [K,n] 연속상 점증  η(cP) = K · c^n     (c = %)
     lam   라멜라 겔망 기여 (지방알코올·왁스류)
     lab   고유색 CIE L*a*b*   tint 색력(가중치)
     op    탁도 기여 (NTU / %)

function prune(st, hasOil) {
  var needAdd = { add: 1, neutralize: 1, hydrate: 1, melt: 1, grind: 1 };
  st = st.filter(function (s) {
    if (needAdd[s.t] && (!s.add || !s.add.length)) return false;

             : g.cat === 'cond' ? '컨디셔닝'
             : g.cat === 'misc' ? '첨가'

  d: '세게 저을수록 묽어지는 성질. 지수 n 이 1 이면 뉴턴, 작을수록 강한 전단감점.',
  n: '화장품에 꼭 필요한 성질이다. 통 안에서는 되직해 분리를 막고, 바를 때는 묽어져 잘 펴진다. 카보머 겔은 n 이 0.2 부근으로 매우 강하다.' },

{ ko: '항복응력', en: 'Yield Stress', g: 'rheo',
  d: '그 이상 힘을 줘야 비로소 흐르기 시작하는 최소 응력. 단위 Pa.',
  n: '이게 있으면 파우더나 액적이 아예 가라앉지 않는다. 잔탄검·젤란검이 특히 크다. 결과 화면에서 "크리밍 정지" 로 나오면 항복응력이 액적의 부력을 이겼다는 뜻이다.' },

{ ko: '크리거–도허티 식', en: 'Krieger–Dougherty', g: 'rheo',
  d: '분산된 입자가 많아질수록 점도가 얼마나 오르는지 계산하는 식.',
  n: 'η = η₀(1 − φ/φm)^(−2.5φm). 내상 부피분율 φ 가 최대충전율 φm(약 0.72)에 가까워지면 점도가 폭발한다. 액적이 작을수록 계면층 때문에 유효 φ 가 커져 더 되직해진다.' },

/* ── 안정성 ────────────────────────────────────────────────────── */
{ ko: '크리밍', en: 'Creaming', g: 'stab',
  d: '가벼운 액적이 위로 떠올라 위층이 진해지는 현상.',
  n: '스토크스 법칙대로 액적 지름의 제곱에 비례하고 연속상 점도에 반비례한다. 흔들면 되돌아오므로 치명적이진 않지만, 크리밍이 오래되면 합일로 넘어간다.' },

{ ko: '스토크스 법칙', en: "Stokes' Law", g: 'stab',
  d: 'v = Δρ·g·d² / 18η. 액적이 뜨거나 가라앉는 속도를 주는 식.',
  n: '안정화의 세 갈래가 여기서 나온다 — 밀도 차를 줄이거나, 액적을 잘게 하거나, 연속상을 되직하게 하거나. 실무에서는 두 번째와 세 번째를 쓴다.' },

{ ko: '합일', en: 'Coalescence', g: 'stab',
  d: '액적끼리 만나 계면막이 터지며 하나로 합쳐지는 것.',
  n: '되돌릴 수 없다. 유화제가 계면을 충분히 덮지 못했을 때, 또는 고온에서 일어난다. 크리밍과 달리 흔들어도 회복되지 않는다.' },

{ ko: '오스트발트 라이프닝', en: 'Ostwald Ripening', g: 'stab',
  d: '작은 액적이 녹아 큰 액적으로 옮겨 가며 전체가 굵어지는 현상.',
  n: '작은 액적일수록 내부 압력이 높아 물질이 빠져나간다. 오일의 수용해도가 클수록 빠르다. 용해도가 낮은 오일을 조금 섞으면 억제된다.' },

{ ko: '석출', en: 'Precipitation · Recrystallization', g: 'stab',
  d: '녹아 있던 성분이 용해도를 넘겨 결정으로 다시 나오는 것.',
  n: '알란토인 0.5% 초과, 덜 녹인 세라마이드, 식으면서 다시 굳는 BEMT 가 대표적이다. 바를 때 서걱거리고 탁도가 치솟는다.' },

{ ko: '그레이닝', en: 'Graining', g: 'stab',
  d: '버터·왁스의 결정형이 시간이 지나며 큰 결정으로 바뀌어 오돌토돌해지는 것.',
  n: '시어버터가 대표적이다. 급냉하면 불안정한 결정형으로 굳었다가 나중에 안정형으로 옮겨 가며 알갱이가 생긴다. 템퍼링(서서히 냉각)으로 막는다.' },

{ ko: '이온 충돌 침전', en: 'Ionic Incompatibility', g: 'stab',
  d: '양이온 계면활성제와 음이온 계면활성제가 만나 그 자리에서 복합체를 이뤄 가라앉는 것.',
  n: '샴푸(음이온)에 컨디셔너 성분(양이온 계면활성제)을 넣으면 바로 일어난다. 다만 폴리쿼터늄 같은 양이온 "폴리머" 는 예외적으로 함께 쓸 수 있다.' },

/* ── 화학 ──────────────────────────────────────────────────────── */
{ ko: 'pH', en: 'pH', g: 'chem',
  d: '수소 이온 농도의 음의 로그. 7 이 중성, 낮으면 산성.',
  n: '피부는 약산성(4.5~5.5)이다. pH 는 방부력·활성 안정성·점증제 효율·양이온 흡착을 한꺼번에 좌우한다. 화장품에서 가장 많은 것을 결정하는 숫자 하나를 꼽으라면 이것이다.' },

{ ko: '완충', en: 'Buffering', g: 'chem',
  d: '산이나 염기를 조금 넣어도 pH 가 잘 안 변하게 붙잡는 성질.',
  n: '약산과 그 짝염기가 함께 있을 때 생긴다(시트릭애씨드 + 소듐시트레이트). 완충이 없으면 원료 한 방울에 pH 가 크게 흔들려 재현성이 무너진다.' },

{ ko: '중화도', en: 'Degree of Neutralization (α)', g: 'chem',
  d: '산성기 중 몇 %가 염기와 반응했는지의 비율.',
  n: '카보머는 이 값이 곧 점도다. 0 이면 물처럼 묽고, 0.7 부근에서 최대가 되며, 1 을 넘겨 과중화하면 오히려 떨어진다. 처방 화면의 중화 계산기가 목표 pH 에 맞는 양을 계산해 준다.' },

{ ko: '폴리전해질', en: 'Polyelectrolyte', g: 'chem',
  d: '한 분자에 이온화되는 자리가 수백 개 붙어 있는 고분자.',
  n: '카보머가 그렇다. 이온화될수록 사슬끼리 밀어내며 펴져 부피가 커지고, 그래서 점도가 오른다. 중화 곡선이 단순한 산보다 훨씬 완만하다.' },

{ ko: '전해질 지수', en: 'Electrolyte Load', g: 'chem',
  d: '처방에 든 이온성 물질이 겔 구조를 무너뜨리는 힘을 하나로 합친 값.',
  n: '소금뿐 아니라 EDTA, 시트레이트, 아미노산계 유화제, 추출물, 나이아신아마이드까지 모두 보탠다. 카보머는 여기에 가장 약하고, 잔탄검·세피맥스젠은 강하다.' },

{ ko: '솔트 커브', en: 'Salt Curve', g: 'chem',
  d: '계면활성제 처방에 소금을 넣을 때 점도가 올랐다가 다시 떨어지는 곡선.',
  n: '봉우리를 넘기면 아무리 더 넣어도 묽어지기만 한다. 샴푸 점도 조절의 기본기이자, 봉우리 근처에 놓으면 원료 편차에 점도가 크게 흔들려 생산이 불안정해진다.' },

{ ko: '비누화', en: 'Saponification', g: 'chem',
  d: '지방산이 알칼리와 반응해 비누(지방산염)가 되는 반응.',
  n: '폼 클렌저는 이 반응을 탱크 안에서 직접 일으킨다. 반응이 진행되며 점도가 급상승하고 열이 난다. 이론량의 90~95% 만 중화하는 것이 정석 — 남은 알칼리는 그대로 자극이 된다.' },

{ ko: '킬레이트', en: 'Chelation', g: 'chem',
  d: '금속 이온을 집게처럼 붙잡아 반응하지 못하게 가두는 것.',
  n: '철·구리 이온은 산화를 촉매해 변색과 산패를 일으킨다. EDTA 0.05% 면 충분하고, 방부력도 함께 올라간다. 다만 구리 펩타이드처럼 금속이 유효성분인 경우에는 오히려 효과를 없앤다.' },

{ ko: '산패', en: 'Rancidity', g: 'chem',
  d: '불포화 오일이 산소와 반응해 냄새와 색이 변하는 것.',
  n: '이중결합이 많을수록 빠르다. 로즈힙·아르간이 대표적이다. 항산화제(토코페롤·BHT)와 킬레이트제로 늦춘다.' },

{ ko: '마이야르 반응', en: 'Maillard Reaction', g: 'chem',
  d: '당과 아미노기가 열을 받아 갈색 물질을 만드는 반응.',
  n: '발효물·추출물·단백질·당류가 든 처방을 오래 가열하면 누렇게 뜬다. 이 도구의 "갈변 지수" 가 이 정도를 나타낸다.' },

/* ── 빛 · 색 ───────────────────────────────────────────────────── */
{ ko: '탁도', en: 'Turbidity (NTU)', g: 'opt',
  d: '빛이 얼마나 산란되어 뿌옇게 보이는지의 척도.',
  n: '5 미만이면 투명, 300 넘으면 반투명, 2,000 넘으면 불투명하다. 토너는 낮아야 하고 로션은 높아야 한다. 즉 탁도는 "좋고 나쁨" 이 아니라 제품이 의도한 값에 맞는지의 문제다.' },

{ ko: '굴절률', en: 'Refractive Index (n)', g: 'opt',
  d: '물질 안에서 빛이 꺾이는 정도. 물 1.333, 오일 1.43~1.48.',
  n: '유화물이 하얗게 보이는 이유는 물과 오일의 굴절률이 다르기 때문이다. 실리콘(1.40)은 차이가 작아 덜 뿌옇고, 미네랄오일(1.47)은 가장 하얗다. 글리세린을 많이 넣어 수상 굴절률을 올리면 제형이 맑아진다.' },

{ ko: 'Mie 산란', en: 'Mie Scattering', g: 'opt',
  d: '빛의 파장과 비슷한 크기의 입자가 빛을 흩뜨리는 방식.',
  n: '단위 부피당 산란은 입자가 0.25 µm 부근일 때 가장 강하다. 그보다 작으면 급격히 투명해지고(마이크로에멀전), 크면 조금씩 줄어든다. 이 도구의 탁도 계산이 이 곡선을 따른다.' },

{ ko: 'CIE L*a*b*', en: 'CIELAB', g: 'opt',
  d: '사람이 느끼는 색을 밝기(L)·빨강초록(a)·노랑파랑(b) 세 축으로 나타낸 좌표.',
  n: '두 색의 차이를 ΔE 라는 하나의 거리로 잴 수 있어 색 관리에 쓴다. ΔE 가 1 이면 훈련된 눈이 겨우 구분하고, 3 을 넘으면 누구나 다르다고 느낀다.' },

{ ko: '백탁', en: 'White Cast', g: 'opt',
  d: '무기 자외선차단제가 빛을 산란시켜 피부가 하얗게 뜨는 현상.',
  n: '티타늄디옥사이드는 굴절률이 2.55 로 압도적이라 특히 심하다. 입자를 잘게 하고 잘 분산시키면 줄지만, 너무 잘게 하면 차단력이 떨어져 균형점을 찾아야 한다.' },

/* ── 자외선 차단 ───────────────────────────────────────────────── */
{ ko: 'SPF', en: 'Sun Protection Factor', g: 'uv',
  d: '자외선 B 를 막아 홍반이 생기기까지의 시간을 몇 배로 늘리는지.',
  n: 'SPF 30 은 96.7%, SPF 50 은 98% 를 막는다. 두 배 차이가 아니다. 실제로는 2 mg/cm² 를 발라야 표시값이 나오는데, 사람들은 보통 그 4분의 1 만 바른다.' },

{ ko: 'UVA-PF · PA', en: 'UVA Protection Factor', g: 'uv',
  d: '자외선 A 차단력. 한국·일본은 이 값을 PA+ ~ PA++++ 등급으로 표시한다.',
  n: 'UVA-PF 2 이상 PA+, 4 이상 PA++, 8 이상 PA+++, 16 이상 PA++++. UVA 는 유리를 통과하고 진피까지 들어가 광노화를 일으킨다. SPF 만 높고 PA 가 낮은 제품은 반쪽짜리다.' },

{ ko: '광안정성', en: 'Photostability', g: 'uv',
  d: '자외선차단 성분이 빛을 받고도 분해되지 않고 버티는 성질.',
  n: '아보벤존은 빛을 받으면 스스로 부서진다. 옥토크릴렌·티노소브 계열을 함께 넣어 에너지를 넘겨받게 해야 한다. 광불안정한 처방은 바르고 두 시간 뒤엔 차단력이 절반이 된다.' },

{ ko: '유기 · 무기 차단제', en: 'Organic · Inorganic Filter', g: 'uv',
  d: '유기는 자외선을 흡수해 열로 바꾸고, 무기는 산란·반사시킨다.',
  n: '유기는 발림성이 좋지만 완전히 녹여야 하고 광안정성 문제가 있다. 무기는 안정하지만 백탁이 있고 분산이 어렵다. 요즘은 둘을 섞은 하이브리드가 주류다.' },

/* ── 공정 ──────────────────────────────────────────────────────── */
{ ko: '아지믹서 · 호모믹서', en: 'Agitator · Homomixer', g: 'proc',
  d: '아지믹서는 전체를 크게 순환시키고, 호모믹서는 좁은 틈에서 강한 전단으로 잘게 쪼갠다.',
  n: '역할이 다르므로 둘 다 필요하다. 아지만 돌리면 액적이 안 쪼개지고, 호모만 돌리면 탱크 구석이 안 섞인다.' },

{ ko: '팁속도', en: 'Tip Speed', g: 'proc',
  d: '회전 날개 끝의 선속도. π × 지름 × rpm ÷ 60, 단위 m/s.',
  n: '전단의 세기를 나타내는 진짜 지표다. rpm 이 아니다. 같은 3,000 rpm 이라도 랩용 32 mm 호모는 5 m/s, 생산용 250 mm 호모는 39 m/s 라 완전히 다른 일이 벌어진다.' },

{ ko: 'P/V', en: 'Power per Volume', g: 'proc',
  d: '단위 부피당 투입 동력. 스케일업의 대표 기준 중 하나.',
  n: '팁속도를 맞추면 P/V 가 줄고, P/V 를 맞추면 팁속도가 폭증한다. 둘 다 맞출 수는 없다. 무엇을 지킬지 고르는 것이 스케일업의 핵심 판단이다.' },

{ ko: '수화', en: 'Hydration', g: 'proc',
  d: '고분자가 물을 빨아들여 사슬을 완전히 펴는 과정.',
  n: '카보머는 30분 이상 걸린다. 덜 편 상태로 중화하면 점도가 20~30% 덜 나온다. 급하게 물에 부으면 겉만 젖고 속은 마른 덩어리(fish-eye)가 생긴다.' },

{ ko: '진공 탈포', en: 'Vacuum Deaeration', g: 'proc',
  d: '감압으로 제형에 들어간 공기를 빼내는 것.',
  n: '되직한 제형에 들어간 기포는 저절로 빠지지 않는다. 탁도가 오르고, 충전 중량이 흔들리고, 산화가 빨라진다. 유화 자체를 진공에서 하면 애초에 덜 들어간다.' },

{ ko: '열이력', en: 'Thermal History', g: 'proc',
  d: '제형이 얼마나 높은 온도에 얼마나 오래 있었는지를 하나로 합친 값.',
  n: '활성 성분 분해, 향 손실, 갈변이 모두 여기에 비례한다. 최고 온도만이 아니라 "그 온도에 머문 시간" 이 중요하다. 대량 배치가 불리한 가장 큰 이유.' },

  cct: 30, ceh: 12, ipm: 6, dcc: 8, dce: 5, coco: 12, squal: 32,
  minoil: 65, jojoba: 30, maca: 60, argan: 60, rosehip: 45, sunfl: 55,
  olive: 80, castor: 700, isododec: 2, petro: 40000, bos: 90,
  dime5: 5, dime350: 350, d5: 4, phenyl: 25, amodime: 900,
  emc: 12, ehs: 10, octo: 300, ubm: 200, bemt: 3000, peg7gc: 200,
  shea: 8000, tocoph: 2500, pg4cap: 300
};

/* ── 유틸 ──────────────────────────────────────────────────────── */
function cl(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smooth(x, a, b) { if (x <= a) return 0; if (x >= b) return 1; var t = (x - a) / (b - a); return t * t * (3 - 2 * t); }

/* Lab → sRGB hex (D65) */
function labToRgb(L, A, B) {
  var y = (L + 16) / 116, x = A / 500 + y, z = y - B / 200;
  var f = function (t) { var t3 = t * t * t; return t3 > 0.008856 ? t3 : (t - 16 / 116) / 7.787; };
  var X = f(x) * 0.95047, Y = f(y) * 1.00000, Z = f(z) * 1.08883;
  var r = X * 3.2406 + Y * -1.5372 + Z * -0.4986,
      g = X * -0.9689 + Y * 1.8758 + Z * 0.0415,
      b = X * 0.0557 + Y * -0.2040 + Z * 1.0570;
  var s = function (c) { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(Math.max(c, 0), 1 / 2.4) - 0.055; return Math.round(cl(c, 0, 1) * 255); };
  var h = function (v) { var t = v.toString(16); return t.length < 2 ? '0' + t : t; };
  return '#' + h(s(r)) + h(s(g)) + h(s(b));
}

/* =====================================================================
   1. 조성 집계
   ===================================================================== */
function composition(rows) {
  var a = {
    total: 0, water: 0, polyol: 0, oil: 0, wax: 0, powder: 0,
    emul: 0, emulHi: 0, emulLo: 0, surf: 0, surfActive: 0, cond: 0,
    lam: 0, salt: 0, saltAdd: 0, etoh: 0, nacl: 0, thickGel: 0,
    uvOrg: 0, uvInorg: 0, spfRaw: 0, pfaRaw: 0, foamRaw: 0, hardRaw: 0, oxIdx: 0, antiox: 0,
    extract: 0, filmer: 0, pigment: 0,
    oilVol: 0, watVol: 0, pwdVol: 0, totVol: 0,
    riOil: 0, riWat: 0, cost: 0, rhSum: 0, rhW: 0, hlbSum: 0, hlbW: 0,
    thickers: [], colors: [], byCat: {}, rows: []
  };
  /* 알칼리가 있으면 지방산은 그 자리에서 비누가 된다 — 오일이 아니라 계면활성제 */
  var FATTY = ['myristic', 'lauric', 'stearic'];
  var alkali = rows.some(function (r) {
    return r.pct > 0 && ['koh', 'naoh', 'tea', 'arginine', 'tromet'].indexOf(r.id) >= 0;
  });
  a.soap = alkali && rows.some(function (r) { return r.pct > 0 && FATTY.indexOf(r.id) >= 0; });

  var rawTotal = rows.reduce(function (x, y) { return x + (+y.pct > 0 ? +y.pct : 0); }, 0);
  var norm = rawTotal > 0 ? 100 / rawTotal : 1;
  a.rawTotal = rawTotal;

  rows.forEach(function (r) {
    var g = ING.BY[r.id]; if (!g || !(r.pct > 0)) return;
    var c = r.pct * norm;                     /* 100% 기준으로 환산 */
    var saponified = a.soap && FATTY.indexOf(g.id) >= 0;
    a.total += c;
    a.cost += c / 100 * g.pr;
    a.byCat[g.cat] = (a.byCat[g.cat] || 0) + c;
    a.rows.push({ g: g, c: c });

    var vol = c / g.d;
    a.totVol += vol;
    a.salt += (g.el || 0) * c;

    if (g.id === 'naclthick') a.nacl += c;
    if (g.id === 'etoh') a.etoh += c;

    var isEmul = saponified || (g.cat === 'emul') ||
                 (g.hlb > 0 && ['surf', 'presv', 'thick'].indexOf(g.cat) < 0) ||
                 (g.cat === 'cond' && g.lam > 0);
    var oily = !saponified && ((g.sol === 'o') || (g.cat === 'wax') || (g.cat === 'oil') || (g.cat === 'sili'));
    var pwd = (g.sol === 'd');

    if (pwd) { a.powder += c; a.pwdVol += vol; }
    else if (oily) {
      a.oilVol += vol;
      if (g.cat === 'wax') a.wax += c; else a.oil += c;
      if (g.rh > 0 && !isEmul) { a.rhSum += g.rh * c; a.rhW += c; }
      if (!a.riOil) a.riOil = 0;
      a.riOil += g.ri * vol;
    } else {
      a.watVol += vol;
      if (g.cat === 'water' || g.cat === 'humect') { a.water += c; if (g.id !== 'aqua') a.polyol += c; }
      a.riWat += g.ri * vol;
    }

    a.lam += (g.lam || 0) * c;

    /* 유화제 풀 — 양이온 컨디셔닝제(BTMS)도 실제로는 유화제로 작동한다 */
    if (isEmul) {
      a.emul += c;
      var h = saponified ? 18 : (g.hlb > 0 ? g.hlb : 15);
      a.hlbSum += h * c; a.hlbW += c;
      if (h >= 8) a.emulHi += c; else a.emulLo += c;
    }
    if (g.cat === 'surf') { a.surf += c; a.surfActive += c * surfActivity(g.id); }
    if (g.cat === 'cond') a.cond += c;
    /* 계면활성제 자신의 대이온은 "추가 전해질"이 아니다 (솔트 커브용) */
    if (['surf', 'cond'].indexOf(g.cat) < 0) a.saltAdd += (g.el || 0) * c;
    if (g.spf > 0 || g.pfa > 0) {
      a.spfRaw += g.spf * c; a.pfaRaw += g.pfa * c;
      if (g.cat === 'uv') { if (g.sol === 'd') a.uvInorg += c; else a.uvOrg += c; }
    }
    if (g.foam > 0) a.foamRaw += c * surfActivity(g.id) * g.foam;
    if (g.hard > 0) a.hardRaw += g.hard * c;
    if (g.ox >= 0.3 && (g.cat === 'active' || g.cat === 'cond') && g.sol === 'w') a.extract += c;
    if (['isododec', 'undectri', 'c1315', 'd5', 'dce', 'dime5', 'dime350', 'dimecop',
         'hpstarch', 'ps15', 'bos', 'inn'].indexOf(g.id) >= 0) a.filmer += c;
    if (g.tint > 20) a.pigment += c;
    a.oxIdx += (g.ox || 0) * c;
    if (g.id === 'tocoph' || g.id === 'tocotri') a.antiox += c;
    if (g.id === 'bht') a.antiox += c * 6;
    if (g.th) a.thickers.push({ g: g, c: c });
    if (g.tint > 0.05) a.colors.push({ g: g, c: c });
  });

  a.riOil = a.oilVol > 0 ? a.riOil / a.oilVol : 1.46;
  a.riWat = a.watVol > 0 ? a.riWat / a.watVol : 1.333;
  a.dn = Math.abs(a.riOil - a.riWat);
  a.phi = a.totVol > 0 ? (a.oilVol + a.pwdVol) / a.totVol : 0;   /* 내상 부피분율 */
  a.aqueous = a.water + a.surf * 0.6;
  a.anhydrous = a.water < 5;
  return a;
}

/* 계면활성제 원료의 활성분 비율 */
function surfActivity(id) {
  return { sles: 0.70, capb: 0.30, chs: 0.50, slmi: 0.85, cocoglut: 0.30,
           decylglu: 0.50, lauryglu: 0.50, myristic: 1.0, lauric: 1.0 }[id] || 0.5;
}

/* =====================================================================
   2. pH — 산·염기 적정 + 완충 가중 평균
   ===================================================================== */
function pH(rows) {
  var A = 0, B = 0, pkaS = 0, pka0S = 0, nS = 0, w = 0;
  var pvS = 0, pcS = 0;
  var rt = rows.reduce(function (x, y) { return x + (+y.pct > 0 ? +y.pct : 0); }, 0);
  var nz = rt > 0 ? 100 / rt : 1;
  rows.forEach(function (r) {
    var g = ING.BY[r.id]; if (!g || !(r.pct > 0)) return;
    var pct = r.pct * nz;
    var t = AB[r.id];
    if (t) {
      if (t.aeq) {
        var m = t.aeq * pct;                   /* 100 g 기준 mmol */
        A += m; pkaS += t.pka * m; pka0S += t.pka0 * m; nS += t.n * m; w += m;
      }
      if (t.beq) B += t.beq * pct;
    }
    if (g.pc > 0) { pvS += g.pv * g.pc * pct; pcS += g.pc * pct; }
  });

  var pHw = pcS > 0 ? pvS / pcS : 6.5;
  if (A + B < 0.02) return cl(pHw, 2, 12);

  var pka = w > 0 ? pkaS / w : 4.5,
      pka0 = w > 0 ? pka0S / w : 4.5,
      n = w > 0 ? nS / w : 1.0;
  var pHab;

  if (A < 0.01) {                               /* 산 없음 — 잔여 염기 */
    pHab = 14 + Math.log(Math.max(B, 1e-6) / 1000 / 0.1) / Math.LN10;
  } else {
    var alpha = B / A;
    if (alpha <= 0.03) {
      /* 미중화 약산 : pH = ½(pKa − log C) */
      pHab = 0.5 * (pka - Math.log(A / 1000 / 0.1) / Math.LN10);
    } else {
      /* Henderson–Hasselbalch. 폴리전해질은 n>1 로 완만해진다 */
      var al = cl(alpha, 0.03, 0.985);
      pHab = pka0 + n * Math.log(al / (1 - al)) / Math.LN10;
      if (alpha > 1) pHab += Math.min(3.2, 4 * (alpha - 1));   /* 과중화 */
    }
  }
  /* 완충 성분(계면활성제·아미노산·추출물)이 많을수록 적정 결과가 희석된다 */
  var wt = cl((A + B) / ((A + B) + 0.6 * pcS + 0.05), 0, 1);
  return cl(wt * pHab + (1 - wt) * pHw, 1.2, 13.5);
}

/* 카보머 중화도(0~1) — 겔 활성 계산용 */
function neutralDegree(rows) {
  var A = 0, B = 0;
  var rt = rows.reduce(function (x, y) { return x + (+y.pct > 0 ? +y.pct : 0); }, 0);
  var nz = rt > 0 ? 100 / rt : 1;
  rows.forEach(function (r) {
    var t = AB[r.id]; if (!t) return;
    if (t.aeq && (r.id === 'carb940' || r.id === 'pemulen')) A += t.aeq * r.pct * nz;
    if (t.beq) B += t.beq * r.pct * nz;
  });
  if (A <= 0) return 0;
  return cl(B / A, 0, 1.4);
}

/* 카보머를 목표 pH 까지 올리는 데 필요한 중화제 양(%) */
function neutralizerNeeded(rows, agentId, targetPh) {
  var t = AB[agentId]; if (!t || !t.beq) return 0;
  var A = 0, pka0 = 4.8, n = 2.0, w = 0;
  rows.forEach(function (r) {
    var q = AB[r.id]; if (!q || !q.aeq) return;
    var m = q.aeq * r.pct; A += m; pka0 += 0; w += m;
    pka0 = q.pka0; n = q.n;
  });
  if (A <= 0) return 0;
  var tp = targetPh || 6.3;
  var alpha = cl(1 / (1 + Math.pow(10, (pka0 - tp) / n)), 0.05, 0.95);
  return +(A * alpha / t.beq).toFixed(4);
}

/* =====================================================================
   3. 액적 크기 d32 (µm)
   ===================================================================== */
function dropletSize(a, p) {
  if (a.oil + a.wax < 0.02 || a.water < 5) return 0;
  var oilTot = a.oil + a.wax;

  /* 요구 HLB vs 유화제 혼합 HLB */
  var rh = a.rhW > 0 ? a.rhSum / a.rhW : 10;
  var bh = a.hlbW > 0 ? a.hlbSum / a.hlbW : 0;
  var match = a.emul > 0 ? Math.exp(-Math.pow(bh - rh, 2) / 8) : 0;
  /* 가용화(미셀 내부에 오일을 품는 것)는 HLB 가 조금 어긋나도 작동한다 */
  var matchSol = a.emul > 0 ? Math.exp(-Math.pow(bh - rh, 2) / 40) : 0;

  /* 계면장력 (mN/m) */
  var polymerAssist = 0;
  a.thickers.forEach(function (t) { if (t.g.hlb > 0) polymerAssist += t.c * 3.0; });
  var rEff = (a.emul * match + polymerAssist) / Math.max(oilTot, 0.02);
  var rSol = (a.emul * matchSol + polymerAssist + a.surfActive * 0.8 + a.cond * 0.3) /
             Math.max(oilTot, 0.02);
  var sigma = Math.max(0.4, 30 / (1 + 40 * rEff));

  /* 전단 한계 */
  var U = Math.max(p.tip || 0.5, 0.15);
  var fPhi = 1 + 1.5 * a.phi;
  var fEta = cl(Math.pow(Math.max(p.etaC || 20, 1) / 50, -0.15), 0.65, 1.6);
  var dEq = 5.11 * Math.pow(sigma, 0.6) * Math.pow(U, -1.2) * fPhi * fEta;
  var tau = 90;                                            /* s */
  var dShear = dEq * (1 + 3 * Math.exp(-(p.sec || 60) / tau));

  /* 유화제 피복 한계 : d = Γ·6φ / (질량농도) */
  var cover = a.emul * Math.max(match, 0.2) + polymerAssist + a.surfActive * 0.8 + a.cond * 0.3;
  var dCover = cover > 0.01 ? 3e-6 * 6 * a.phi / (10 * cover) * 1e6 : 999;

  /* 가용화 : 계면활성제가 오일보다 훨씬 많으면 전단과 무관하게
     10~40 nm 미셀이 스스로 만들어져 투명해진다 */
  var solub = smooth(rSol, 1.5, 3.0);
  var dSolub = solub > 0.001 ? (0.012 + 0.08 / Math.max(rSol, 0.1)) / solub : 1e9;

  var d = Math.max(dCover, Math.min(dShear, dSolub));
  return { d: cl(d, 0.012, 200), dShear: dShear, dCover: dCover, dSolub: dSolub,
           sigma: sigma, rh: rh, bh: bh, match: match, rEff: rEff, rSol: rSol, solub: solub,
           minor: oilTot < 0.5,
           starved: dCover > Math.min(dShear, dSolub) * 1.15 };
}

/* =====================================================================
   4. 점도 (cP, 25℃, 12 rpm 기준)
   ===================================================================== */
function viscosity(a, env) {
  var ph = env.pH, d32 = env.d32 || 1, alpha = env.alpha || 0;

  /* (1) 용매 점도 — 폴리올 */
  var etaSolv = Math.exp(0.035 * a.polyol);

  /* (2) 점증제 겔 */
  var gel = 0, gelDetail = [];
  var E = a.salt;
  a.thickers.forEach(function (t) {
    var g = t.g, K = g.th[0], n = g.th[1], eff = 1;
    if (g.id === 'carb940' || g.id === 'pemulen') {
      var fp = smooth(ph, 3.9, 5.6) * (1 - smooth(ph, 8.5, 11));
      var fa = cl(alpha / 0.35, 0, 1);
      eff = Math.min(fp, Math.max(fa, fp * 0.15)) / (1 + 1.9 * E) / (1 + 0.06 * a.etoh);
    } else if (g.id === 'xanthan' || g.id === 'sclero' || g.id === 'gellan' || g.id === 'carrag') {
      eff = (1 - smooth(ph, 11, 13)) / (1 + 0.06 * E) / (1 + 0.02 * a.etoh);
    } else if (g.id === 'hec' || g.id === 'ha' || g.id === 'pq10' || g.id === 'guar') {
      eff = 1 / (1 + 0.03 * E) / (1 + 0.03 * a.etoh);
    } else if (g.id === 'peg150ds') {
      eff = Math.min(1, a.surfActive / 6);
    } else if (g.id === 'napolyacr') {
      eff = smooth(ph, 4.5, 6) / (1 + 0.9 * E);
    } else {                                        /* 아리스토플렉스 · 세피노브 · 시뮬젤 */
      eff = smooth(ph, 3, 4.5) * (1 - smooth(ph, 9, 11)) / (1 + 0.35 * E);
    }
    var v = K * Math.pow(Math.max(t.c, 0.001), n) * eff;
    gel += v;
    gelDetail.push({ ko: g.ko, v: v, eff: eff });
  });

  /* (3) 계면활성제 미셀 점도 (샴푸·바디워시) */
  var surfV = 0;
  if (a.surfActive > 4) {
    var s = a.nacl + a.saltAdd * 0.045;
    var saltF = 1 + 16 * s * Math.exp(-s / 1.6);
    surfV = 6.5 * Math.pow(a.surfActive, 1.6) * saltF;
    if (a.cond > 0.2) surfV *= 1 + 0.25 * a.cond;
  }

  /* (4) 라멜라 겔망 (지방알코올 × 유화제) */
  var lamV = 0;
  if (a.lam > 0.05) {
    /* 890·L^2.29 : 세테아릴 1.2 + 유화제 2.0 → 6천 cP(로션),
       세테아릴 3 + 유화제 3 → 3만 cP(크림) 두 점에 맞춘 곡선 */
    var support = cl((a.emul + a.cond * 0.8 + a.surfActive * 0.15) / (0.30 * a.lam), 0, 1);
    lamV = 890 * Math.pow(a.lam, 2.29) * support;
    lamV *= (env.coolFactor || 1);
  }

  /* (5) 내상 부피분율 — Krieger–Dougherty */
  var phiEff = a.phi * Math.pow(1 + 0.02 / Math.max(d32, 0.05), 3);
  var phim = 0.72;
  var KD = Math.pow(1 - Math.min(phiEff, 0.985 * phim) / phim, -1.8);

  /* (6) 무수 제형 */
  var eta;
  if (a.anhydrous) {
    var ov = 0, ow = 0;
    a.rows.forEach(function (r) {
      var v = OILV[r.g.id]; if (v == null) v = (r.g.sol === 'o' ? 40 : 20);
      ov += Math.log(v) * r.c; ow += r.c;
    });
    eta = ow > 0 ? Math.exp(ov / ow) : 30;
    if (a.wax > 0.5) eta *= Math.pow(1 + a.wax, 2.6);
    if (a.powder > 0.5) eta *= Math.pow(1 - Math.min(a.pwdVol / a.totVol, 0.5) / 0.62, -1.8);
  } else {
    eta = (etaSolv + gel + surfV) * KD + lamV;
  }

  /* (7) 전단감점 지수 n */
  var struct = gel + lamV + surfV * 0.4;
  var frac = struct / Math.max(eta, 1);
  var nIdx = cl(1 - 0.78 * frac, 0.16, 1);

  /* (8) 항복응력 (Pa) — 파우더·액적 부유 판정 */
  /* 항복응력 (Pa) — 0.45% 카보머 겔 ≈ 60, 크림 ≈ 20, 로션 ≈ 3 에 맞춘 곡선 */
  var yieldS = gel > 20 ? 3.2e-4 * Math.pow(gel, 1.216) : 0;
  if (lamV > 500) yieldS += 1.49e-5 * Math.pow(lamV, 1.332);   /* 라멜라가 액적을 붙든다 */
  if (a.thickers.some(function (t) { return t.g.id === 'xanthan' || t.g.id === 'gellan'; })) yieldS *= 2.2;

  return { eta: eta, gel: gel, lam: lamV, surfV: surfV, KD: KD, n: nIdx,
           yieldStress: yieldS, detail: gelDetail, phiEff: phiEff };
}

/* Brookfield rpm 별 겉보기 점도 */
function apparent(eta12, n, rpm) {
  return eta12 * Math.pow((rpm || 12) / 12, n - 1);
}

/* =====================================================================
   4.5 자외선 차단 — SPF · UVA-PF · PA 등급
   ---------------------------------------------------------------------
   각 필터의 1% 당 기여를 더한 뒤, 실제로 SPF 를 깎아먹는 세 가지로 보정한다.
     · 광불안정   아보벤존은 안정화제가 없으면 빛을 받아 스스로 부서진다
     · 도포막     퍼짐이 나쁘거나 액적이 굵으면 막이 얼룩져 표시값이 안 나온다
     · 미용해     결정이 남은 필터는 그만큼 일을 하지 않는다
   ===================================================================== */
function uvProtect(a, env) {
  if (a.spfRaw < 1) return null;
  var spf = a.spfRaw, pfa = a.pfaRaw;
  var notes = [];

  /* 광안정성 */
  var avo = 0, stabilizer = 0;
  a.rows.forEach(function (r) {
    if (r.g.id === 'ubm') avo += r.c;
    if (['octo', 'bemt', 'eht', 'ps15', 'dhhb', 'mbbt'].indexOf(r.g.id) >= 0) stabilizer += r.c;
  });
  var photo = 1;
  if (avo > 0.2 && stabilizer < avo * 0.8) {
    photo = 0.62;
    notes.push({ sev: 12, ko: '광불안정',
      msg: '아보벤존 ' + avo.toFixed(1) + '% 를 잡아줄 광안정화제가 ' + stabilizer.toFixed(1) +
           '% 뿐이다. 햇빛 아래에서 스스로 분해되어 차단력이 시간에 따라 떨어진다. ' +
           '옥토크릴렌이나 티노소브 계열을 아보벤존의 0.8배 이상 넣어라.' });
  }

  /* 도포막 균일성 */
  var film = cl(0.70 + 0.30 * Math.min(1, a.filmer / 3), 0.70, 1.0);
  var d = env.d32 || 0;
  if (d > 3) film *= cl(1 - (d - 3) / 12, 0.7, 1);
  if (a.uvInorg > 1 && a.emul < 0.8) {
    film *= 0.82;
    notes.push({ sev: 9, ko: '무기 분산 불량',
      msg: '무기 차단제 ' + a.uvInorg.toFixed(1) + '% 에 비해 분산·유화제가 모자란다. ' +
           '입자가 뭉치면 뭉친 만큼 빛이 새어 나가 표시 SPF 가 나오지 않는다.' });
  }

  /* 미용해 필터 */
  var undis = env.uvUndissolved ? 0.7 : 1;

  spf = 1 + (spf - 0) * photo * film * undis;
  pfa = pfa * photo * film * undis;

  var pa = pfa >= 16 ? 'PA++++' : pfa >= 8 ? 'PA+++' : pfa >= 4 ? 'PA++' : pfa >= 2 ? 'PA+' : '등급 없음';
  var broad = pfa >= spf / 3;
  if (pfa < spf / 4 && spf > 15)
    notes.push({ sev: 10, ko: 'UVA 부족',
      msg: 'UVA-PF ' + pfa.toFixed(1) + ' 은 SPF ' + Math.round(spf) + ' 에 비해 너무 낮다. ' +
           'UVB 만 막는 제품이 되어 광노화를 막지 못한다. ' +
           'UVA 필터(다이에틸아미노하이드록시벤조일헥실벤조에이트 · 티노소브 · 징크옥사이드)를 늘려라.' });

  return { spf: Math.max(1, spf), pfa: pfa, pa: pa, broad: broad,
           org: a.uvOrg, inorg: a.uvInorg, film: film, photo: photo, notes: notes };
}

/* =====================================================================
   4.6 거품력 · 경도
   ===================================================================== */
function foaming(a) {
  if (a.foamRaw <= 0.05) return 0;
  var kill = a.oil + a.wax * 0.6 + a.pigment;      /* 오일·실리콘은 거품을 죽인다 */
  return Math.min(100, 5.5 * a.foamRaw / (1 + 0.2 * kill));
}

function hardness(a) {
  if (!a.anhydrous) return 0;
  return a.hardRaw;
}

/* =====================================================================
   5. 탁도 (NTU)
   ===================================================================== */
function turbidity(a, env) {
  var ntu = 0, src = [];

  /* 파우더·무기입자 */
  var pw = 0;
  a.rows.forEach(function (r) { if (r.g.op > 0 && r.g.sol === 'd') pw += r.g.op * r.c; });
  if (pw > 0) { ntu += pw; src.push({ ko: '파우더·무기입자', v: pw }); }

  /* 유화 액적 */
  if (a.phi > 0.001 && env.d32 > 0) {
    var x = env.d32 / 0.12;
    var x4 = Math.pow(x, 4);
    var s = 3.5 * x4 / ((1 + x4) * (1 + 0.25 * x));
    var e = 5.5e4 * a.phi * Math.pow(a.dn / 0.137, 2) * s;
    ntu += e; src.push({ ko: '유화 액적 산란', v: e });
  }

  /* 미셀·고분자 자체 탁도 */
  var mz = 0;
  a.rows.forEach(function (r) { if (r.g.op > 0 && r.g.sol !== 'd') mz += r.g.op * r.c; });
  if (a.anhydrous) mz *= 0.12;                    /* 물이 없으면 미셀 산란도 없다 */
  if (mz > 0) { ntu += mz; src.push({ ko: '용해 원료 자체 탁도', v: mz }); }

  /* 석출 결정 */
  if (env.precipitate > 0) { ntu += env.precipitate; src.push({ ko: '결정 석출·미용해', v: env.precipitate }); }

  /* 기포 */
  if (env.airPct > 0) { var b = 60 * env.airPct; ntu += b; src.push({ ko: '혼입 기포', v: b }); }

  ntu = Math.max(ntu, 0.3);
  return { ntu: ntu, grade: grade(ntu), src: src };
}

function grade(n) {
  if (n < 5) return '투명';
  if (n < 40) return '미탁';
  if (n < 300) return '반투명';
  if (n < 2000) return '유백';
  return '불투명';
}

/* =====================================================================
   6. 색상
   ===================================================================== */
function color(a, env) {
  var L = 0, A = 0, B = 0, W = 0;
  a.rows.forEach(function (r) {
    var w = r.g.tint * r.c;
    if (w <= 0) return;
    L += r.g.lab[0] * w; A += r.g.lab[1] * w; B += r.g.lab[2] * w; W += w;
  });
  /* 산란에 의한 백색 */
  var white = 9 * Math.min(1, (env.ntu || 0) / 600);
  L += 97 * white; A += -0.4 * white; B += 1.2 * white; W += white;
  /* 무색 베이스 */
  L += 99 * 3; A += -0.3 * 3; B += 0.6 * 3; W += 3;

  L /= W; A /= W; B /= W;

  /* 갈변 · 산화 */
  var br = env.browning || 0;
  L -= br * 0.85; A += br * 0.38; B += br * 1.0;

  L = cl(L, 8, 100); A = cl(A, -60, 70); B = cl(B, -60, 90);
  return { L: L, a: A, b: B, hex: labToRgb(L, A, B), browning: br };
}

/* =====================================================================
   7. 안정성 진단
   ===================================================================== */
function stability(a, env) {
  var items = [], score = 100;
  function bad(sev, ko, msg) { items.push({ sev: sev, ko: ko, msg: msg }); score -= sev; }

  var dp = env.drop, v = env.visc, ph = env.pH;

  if (a.oil + a.wax > 1 && a.water > 5) {
    /* HLB */
    if (dp && a.emul > 0.05 && a.rhW > 0.5) {
      var dev = Math.abs(dp.bh - dp.rh);
      if (dev > 3.5) bad(18, 'HLB 불일치',
        '유화제 HLB ' + dp.bh.toFixed(1) + ' 대 오일 요구 HLB ' + dp.rh.toFixed(1) +
        ' — 차이 ' + dev.toFixed(1) + '. 저HLB/고HLB 유화제 비율을 조정하라.');
      else if (dev > 1.6) bad(7, 'HLB 근소 불일치',
        'HLB 차이 ' + dev.toFixed(1) + '. ±1.5 안으로 맞추면 액적이 더 작아진다.');
    }
    if (a.emul < 0.05 && !a.thickers.some(function (t) { return t.g.hlb > 0; }))
      bad(35, '유화제 없음', '오일 ' + (a.oil + a.wax).toFixed(1) + '% 를 잡아줄 유화제가 없다. 즉시 분리된다.');
    else if (dp && dp.starved)
      bad(20, '유화제 부족',
        '계면을 덮을 유화제가 모자라 액적이 ' + dp.dCover.toFixed(2) + ' µm 아래로 내려가지 못한다. 유화제를 늘리거나 오일을 줄여라.');

    /* 크리밍 (Stokes) */
    if (dp && dp.d > 0) {
      var dm = dp.d * 1e-6;
      /* 연속상 점도 — 라멜라·미셀 구조도 액적의 상승을 늦춘다 */
      var etaC = Math.max((v.gel + v.lam * 0.6 + v.surfV * 0.35 +
                           Math.exp(0.035 * a.polyol)) / 1000, 0.001);          /* Pa·s */
      var vel = 100 * 9.81 * dm * dm / (18 * etaC);                              /* m/s */
      var mmday = vel * 86400 * 1000;
      var held = v.yieldStress > 100 * 9.81 * dm / 6;
      env.creamMmDay = held ? 0 : mmday;
      if (!held) {
        if (mmday > 20) bad(25, '크리밍·분리', '액적 ' + dp.d.toFixed(2) + ' µm, 연속상 점도가 낮아 상승 속도 ' + mmday.toFixed(1) + ' mm/일. 하루 이틀이면 층이 보인다.');
        else if (mmday > 2) bad(12, '크리밍 진행', '상승 속도 ' + mmday.toFixed(2) + ' mm/일. 몇 주 안에 위층이 진해진다. 점증제를 올리거나 액적을 더 잘게.');
        else if (mmday > 0.3) bad(4, '완만한 크리밍', '상승 속도 ' + mmday.toFixed(2) + ' mm/일. 흔들면 되돌아오는 수준.');
      }
    }
    /* 상 반전 */
    if (a.phi > 0.70) bad(20, '상 반전 위험', '내상 부피분율 ' + (a.phi * 100).toFixed(0) + '%. 74%를 넘으면 O/W가 W/O로 뒤집힌다.');
  }

  /* ── 제형이 성립하는가 ─────────────────────────────────────────
     점도도 유화도 세정력도 없는 것은 "묽은 무엇" 이지 제품이 아니다.     */
  var structure = v.gel + v.lam + v.surfV;
  var oilTot = a.oil + a.wax;
  var nRows = a.rows.length;

  /* 이 제품이 "되기" 를 가져야 하는가. 규격 점도 하한이 알려 준다. */
  var wantsBody = env.expectVisc ? env.expectVisc[0] >= 400 : true;

  if (wantsBody && a.water > 60 && structure < 25 && oilTot < 1 && a.surfActive < 1 && a.powder < 1) {
    bad(30, '제형이 없다',
      '물에 몇 가지를 녹여 놓았을 뿐이다. 점증제도 유화제도 세정 계면활성제도 없어 ' +
      '통에 담으면 그냥 물처럼 흐른다. 무엇을 만들려는지에 따라 ' +
      '점증제(젤·에센스) · 유화제와 오일(로션·크림) · 계면활성제(세정) 중 하나는 반드시 있어야 한다.');
  } else if (a.water > 40 && structure < 25 && oilTot >= 1 && a.emul < 0.05) {
    bad(28, '섞이지 않는 조합',
      '오일 ' + oilTot.toFixed(1) + '% 를 물에 넣었는데 유화제가 없다. ' +
      '섞는 순간부터 갈라지기 시작해 통에 담기도 전에 두 층이 된다.');
  }

  if (nRows <= 3 && a.water > 50)
    bad(12, '처방이라 하기 어렵다',
      '원료가 ' + nRows + '종뿐이다. 실제 제품은 보습·점증·유화·방부·pH 조절이 각자의 역할로 들어간다.');

  if (a.water > 30 && (a.byCat.humect || 0) < 0.5 && !a.anhydrous)
    bad(6, '보습제 없음',
      '보습제가 없다. 바르고 나면 물만 증발하고 남는 것이 없어 오히려 당긴다. ' +
      '글리세린·부틸렌글라이콜을 5% 안팎으로 넣는다.');

  /* 전해질 vs 카보머 */
  var carb = a.thickers.filter(function (t) { return t.g.id === 'carb940' || t.g.id === 'pemulen'; });
  if (carb.length && a.salt > 0.5)
    bad(a.salt > 2 ? 16 : 8, '전해질 부하',
      '염 지수 ' + a.salt.toFixed(2) + '. 카보머 겔이 ' + ((1 - 1 / (1 + 1.9 * a.salt)) * 100).toFixed(0) + '% 만큼 무너졌다. 잔탄검·세피노브 같은 내염 점증제로 바꿔라.');
  if (carb.length && env.alpha < 0.25)
    bad(22, '중화 부족', '카보머 중화도 ' + (env.alpha * 100).toFixed(0) + '%. 점도가 나오지 않는다. TEA·아르지닌·NaOH로 pH 5.5~7까지 올려라.');

  /* pH 적합성 — 비누(지방산 + 알칼리) 제형은 알칼리가 설계다 */
  var soap = a.rows.some(function (r) { return ['myristic', 'lauric', 'stearic'].indexOf(r.g.id) >= 0; }) &&
             a.rows.some(function (r) { return ['koh', 'naoh', 'tea'].indexOf(r.g.id) >= 0; });
  if (ph < 3.0) bad(10, 'pH 과산성', 'pH ' + ph.toFixed(2) + '. 자극 위험이 크다.');
  if (ph > 11.2) bad(16, 'pH 과알칼리', 'pH ' + ph.toFixed(2) + '. 과중화다. 알칼리를 줄여라.');
  else if (ph > 8.5 && !soap) bad(12, 'pH 과알칼리', 'pH ' + ph.toFixed(2) + '. 피부 장벽을 해치고 원료가 가수분해된다.');

  /* 가용화되지 않은 향료·오일 */
  if (dp && dp.minor && dp.rSol < 1.5 && a.water > 20)
    bad(9, '가용화 실패', '향료·오일 ' + (a.oil + a.wax).toFixed(2) + '% 를 잡아줄 가용화제가 모자란다(비 ' +
      dp.rSol.toFixed(1) + ':1). 시간이 지나면 표면에 기름방울이 뜬다. 오일의 4~8배를 넣어라.');

  /* ── 방부 ──────────────────────────────────────────────────────
     가진 방부력(have)을 필요한 방부력(need)으로 나눈다.
     추출물·발효물·전분은 미생물의 먹이라 need 를 올리고,
     높은 폴리올(낮은 수분활성도)과 알칼리 비누는 need 를 내린다.        */
  var have = 0;
  a.rows.forEach(function (r) {
    if (r.g.cat !== 'presv') return;
    var e = r.c / Math.max(r.g.max, 0.01);
    if (['nabenz', 'ksorb', 'levul'].indexOf(r.g.id) >= 0) e *= (1 - smooth(ph, 4.8, 6.2));
    if (['phenox', 'pe9010', 'benzalc'].indexOf(r.g.id) >= 0) e *= (1 - smooth(ph, 7.2, 8.6));
    if (r.g.id === 'cymen') e *= 0.7;
    have += e;
  });
  a.rows.forEach(function (r) {
    if (['hex', 'penta', 'caprylyl', 'ehg'].indexOf(r.g.id) >= 0) have += r.c * 0.28;
    if (r.g.id === 'etoh' && r.c >= 15) have += 0.5;
    if (r.g.id === 'propolis') have += r.c * 0.03;
  });
  if (soap && ph > 9.3) have += 1.0;        /* 알칼리 비누는 그 자체로 미생물을 막는다 */

  var need = 1.0;
  if (a.extract > 5) need += 0.25;
  if (a.extract > 20) need += 0.2;
  if ((a.byCat.powder || 0) > 3 || a.rows.some(function (r) { return r.g.id === 'starch' && r.c > 1; })) need += 0.2;
  if (a.polyol >= 25) need -= 0.3;
  else if (a.polyol >= 15) need -= 0.15;
  if (a.water < 20) need -= 0.45;
  need = Math.max(0.3, need);

  var pres = have / need;
  env.preserve = pres;
  env.presNeed = need;
  if (a.water > 12) {
    if (pres < 0.35) bad(26, '방부 부족',
      '방부 지수 ' + pres.toFixed(2) + '. 수분이 ' + a.water.toFixed(0) + '% 인데 미생물을 막을 수단이 사실상 없다. ' +
      '한 달을 못 간다.');
    else if (pres < 0.75) bad(11, '방부 여유 부족',
      '방부 지수 ' + pres.toFixed(2) + (a.extract > 5 ? ' (추출물 ' + a.extract.toFixed(1) + '% 때문에 요구치가 ' + need.toFixed(2) + '로 올라갔다)' : '') +
      '. 챌린지 테스트를 통과하기 어렵다.');
  }

  /* 석출 */
  if (env.precipNotes) env.precipNotes.forEach(function (t) { bad(t.sev, t.ko, t.msg); });

  /* 열 손상 */
  if (env.lossNotes) env.lossNotes.forEach(function (t) { bad(t.sev, t.ko, t.msg); });

  score = cl(score, 0, 100);
  var g = score >= 90 ? 'S' : score >= 78 ? 'A' : score >= 62 ? 'B' : score >= 45 ? 'C' : 'D';
  return { score: Math.round(score), grade: g, items: items };
}

/* =====================================================================
   8. 통합 평가
   ===================================================================== */
function evaluate(rows, env) {
  env = env || {};
  var a = composition(rows);
  var p = pH(rows);
  var alpha = neutralDegree(rows);

  /* 연속상 점도를 먼저 어림잡아 액적 계산에 넣는다 */
  var v0 = viscosity(a, { pH: p, d32: 1.5, alpha: alpha, coolFactor: env.coolFactor });
  var dp = dropletSize(a, {
    tip: env.tip != null ? env.tip : 6.3,
    sec: env.sec != null ? env.sec : 300,
    etaC: Math.exp(0.035 * a.polyol) + v0.gel
  });
  var d32 = dp ? dp.d : 0;

  var v = viscosity(a, { pH: p, d32: d32 || 1, alpha: alpha, coolFactor: env.coolFactor });
  var t = turbidity(a, { d32: d32, precipitate: env.precipitate || 0, airPct: env.airPct || 0 });
  var c = color(a, { ntu: t.ntu, browning: env.browning || 0 });

  var uv = uvProtect(a, { d32: d32, uvUndissolved: env.uvUndissolved });

  var senv = {
    drop: dp, visc: v, pH: p, alpha: alpha, expectVisc: env.expectVisc,
    precipNotes: (env.precipNotes || []).concat(uv ? uv.notes : []),
    lossNotes: env.lossNotes
  };
  var st = stability(a, senv);

  return {
    agg: a, pH: p, alpha: alpha, drop: dp, d32: d32,
    visc: v, eta: v.eta, nIdx: v.n,
    turb: t, ntu: t.ntu, color: c,
    uv: uv, foam: foaming(a), hard: hardness(a),
    stability: st, cream: senv.creamMmDay || 0,
    preserve: senv.preserve || 0, presNeed: senv.presNeed || 1,
    cost: a.cost, total: a.total
  };
}

/* =====================================================================
   9. 경시 변화 — 보관하면 무슨 일이 생기는가
   ---------------------------------------------------------------------
   days  보관 일수     hot  45℃ 가속 여부(가속 4주 ≈ 상온 1년)
   ===================================================================== */
function age(res, days, hot) {
  var a = res.agg, accel = hot ? 13 : 1;
  var d = days * accel;
  var notes = [];

  /* 층 분리 — 크리밍 속도 × 시간. 항복응력이 붙들면 0 */
  var sepMm = Math.min(45, (res.cream || 0) * d);
  if (sepMm > 0.6) notes.push({
    lv: sepMm > 12 ? 3 : sepMm > 4 ? 2 : 1, ko: '층 분리',
    msg: sepMm > 12 ? '위쪽에 뚜렷한 크림층이 생겼다. 흔들어도 완전히 돌아오지 않는다.'
       : sepMm > 4  ? '위층이 눈에 띄게 진해졌다. 흔들면 섞이지만 다시 뜬다.'
                    : '자세히 보면 위쪽이 조금 진하다.' });

  /* 갈변 — 산화 지수 × 시간 */
  var protect = 1 - Math.min(0.55, a.antiox * 0.5);
  var brown = 0.018 * d * a.oxIdx / 10 * protect;
  if (brown > 1.2) notes.push({
    lv: brown > 10 ? 3 : brown > 4 ? 2 : 1, ko: '변색',
    msg: brown > 10 ? '누렇다 못해 갈색으로 변했다.'
       : brown > 4  ? '뚜렷하게 누레졌다.'
                    : '처음보다 살짝 노란기가 돈다.' });

  /* 액적 성장 — 유화제가 모자라면 합일이 계속된다 */
  var dp = res.drop, dNew = res.d32;

   휠 스테퍼 — 버튼 · 마우스 휠 · 위아래 드래그 · 직접 입력
   ===================================================================== */
function smartStep(v, kind) {
  var a = Math.abs(v);
  if (kind === 'pct') {
    if (a < 0.05) return 0.001;
    if (a < 0.5)  return 0.01;
    if (a < 5)    return 0.1;
    if (a < 30)   return 0.5;
    return 1;
  }
  if (kind === 'rpm')  return a < 400 ? 50 : a < 2000 ? 100 : 250;
  if (kind === 'min')  return a < 10 ? 1 : 5;
  if (kind === 'temp') return 1;
  if (kind === 'g')    return a < 500 ? 50 : a < 5000 ? 500 : a < 100000 ? 5000 : 50000;
  return 1;
}
function decOf(step) {
  return step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
}
function snap(v, step) {
  var d = decOf(step);
  return +(Math.round(v / step) * step).toFixed(d);
}

/* opt : {kind, unit, min, max, cls, fmt, onChange} */
function stepper(value, opt) {
  opt = opt || {};
  var kind = opt.kind || 'pct',
      min = opt.min != null ? opt.min : 0,
      max = opt.max != null ? opt.max : 1e9;
  var val = value;

  var vb = el('b'), vu = opt.unit ? el('em', { text: opt.unit }) : null;
  var vbox = el('div.v', { title: '드래그하거나 휠을 굴려 조절 · 눌러서 직접 입력' }, [vb, vu]);
  var minus = el('button', { type: 'button', text: '−', 'aria-label': '줄이기' });
  var plus  = el('button', { type: 'button', text: '+', 'aria-label': '늘리기' });
  var box = el('div.stp' + (opt.cls ? '.' + opt.cls : ''), null, [minus, vbox, plus]);

  function show() {
    vb.textContent = opt.fmt ? opt.fmt(val) : String(val);
  }
  function commit(nv, silent) {
    nv = Math.max(min, Math.min(max, nv));
    var st = smartStep(nv, kind);
    nv = snap(nv, st);
    if (nv === val) { show(); return; }
    val = nv; show();
    if (!silent && opt.onChange) opt.onChange(val);
  }
  function bump(dir) {
    var st = smartStep(val + (dir > 0 ? 1e-9 : -1e-9), kind);
    /* 경계에서 단계가 바뀔 때 자연스럽게 */
    var nv = snap(val + dir * st, st);
    if (nv === val) nv = val + dir * st;
    commit(nv);

  function hold(btn, dir) {

    });

  /* 마우스 휠 */
  box.addEventListener('wheel', function (e) {
    e.preventDefault();
    bump(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });

  /* 위아래 드래그 */
  var dragging = false, startY = 0, startV = 0, moved = 0;
  vbox.addEventListener('pointerdown', function (e) {
    if (vbox.querySelector('input')) return;
    dragging = true; moved = 0; startY = e.clientY; startV = val;
    vbox.setPointerCapture(e.pointerId);
    box.classList.add('drag');
  });
  vbox.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dy = startY - e.clientY;
    if (Math.abs(dy) > moved) moved = Math.abs(dy);
    var steps = Math.round(dy / 7);
